<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RMT Networks — Clients</title>
<script>
  (function() {
    var token = sessionStorage.getItem('rmt_session');
    if (!token) { window.location.replace('/'); return; }
    fetch('/.netlify/functions/verify', {
      headers: { 'Authorization': 'Bearer ' + token }
    }).then(function(r) {
      if (!r.ok) { sessionStorage.removeItem('rmt_session'); window.location.replace('/'); }
      else { document.body.style.visibility = 'visible'; }
    }).catch(function() { document.body.style.visibility = 'visible'; });
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #0d0f14;
    --surface: #13161e;
    --border:  #1e2230;
    --accent:  #4fffb0;
    --accent2: #4b8fff;
    --warn:    #ff6b4a;
    --text:    #e8eaf0;
    --muted:   #5a6070;
    --card-bg: #181b24;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    visibility: hidden;
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 28px 40px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0;
    background: var(--bg); z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 20px; }
  .back-link {
    font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--muted);
    text-decoration: none; padding: 6px 12px;
    border: 1px solid var(--border); border-radius: 6px;
    transition: color 0.15s, border-color 0.15s;
  }
  .back-link:hover { color: var(--accent); border-color: var(--accent); }
  .logo { font-size: 1.1rem; font-weight: 800; letter-spacing: 0.08em; color: var(--accent); }
  .logo span { color: var(--muted); font-weight: 400; }
  .header-right { display: flex; gap: 10px; align-items: center; }

  .btn {
    font-family: 'DM Mono', monospace; font-size: 0.78rem;
    padding: 9px 18px; border-radius: 6px; border: none;
    cursor: pointer; transition: all 0.15s; letter-spacing: 0.03em;
  }
  .btn-primary { background: var(--accent); color: #000; font-weight: 500; }
  .btn-primary:hover { background: #6fffbe; transform: translateY(-1px); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: var(--muted); }
  .btn-danger { background: transparent; color: var(--warn); border: 1px solid var(--warn); font-size: 0.72rem; padding: 5px 12px; }
  .btn-danger:hover { background: var(--warn); color: #fff; }
  .btn-tiny { font-size: 0.68rem; padding: 4px 10px; }

  main { max-width: 1100px; margin: 0 auto; padding: 40px; }

  .page-title { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .page-title h1 { font-size: 1.8rem; font-weight: 800; }
  .page-title .icon { font-size: 1.8rem; }

  .toolbar {
    display: flex; gap: 12px; align-items: center;
    margin-bottom: 22px; flex-wrap: wrap;
  }
  .search-input {
    flex: 1; min-width: 220px;
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 9px 14px; color: var(--text);
    font-family: 'DM Mono', monospace; font-size: 0.78rem;
  }
  .search-input:focus { outline: none; border-color: var(--accent); }
  select.filter-select {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 12px; color: var(--text);
    font-family: 'DM Mono', monospace; font-size: 0.76rem; cursor: pointer;
  }
  select:focus { outline: none; border-color: var(--accent); }

  /* ── Detail tabs ── */
  .detail-tabs {
    display: flex; gap: 0; margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); font-family: 'DM Mono', monospace; font-size: 0.78rem;
    padding: 10px 20px; cursor: pointer; margin-bottom: -1px;
    transition: color 0.15s, border-color 0.15s; letter-spacing: 0.03em;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── Client cards grid ── */
  .clients-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .client-card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; cursor: pointer;
    transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    display: flex; flex-direction: column; gap: 12px;
  }
  .client-card:hover {
    border-color: rgba(79,255,176,0.4); transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(0,0,0,0.3);
  }
  .client-card-head {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
  }
  .client-name { font-size: 1.05rem; font-weight: 700; }
  .client-company {
    font-family: 'DM Mono', monospace; font-size: 0.72rem;
    color: var(--muted); margin-top: 2px;
  }
  .status-badge {
    font-family: 'DM Mono', monospace; font-size: 0.6rem;
    padding: 3px 9px; border-radius: 20px;
    letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500; flex-shrink: 0;
  }
  .status-active  { background: rgba(79,255,176,0.15);  color: var(--accent); }
  .status-paused  { background: rgba(232,200,64,0.15);  color: #e8c840; }
  .status-former  { background: rgba(90,96,112,0.2);    color: var(--muted); }

  .client-meta {
    font-family: 'DM Mono', monospace; font-size: 0.72rem;
    color: var(--muted); line-height: 1.7;
    display: flex; flex-direction: column; gap: 2px;
  }
  .client-meta .line { display: flex; gap: 8px; align-items: center; }
  .client-meta .icon { opacity: 0.6; width: 14px; flex-shrink: 0; }

  .client-card-footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 10px; border-top: 1px solid var(--border);
    font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--muted);
  }
  .footer-counts { display: flex; gap: 12px; flex-wrap: wrap; }

  /* ── Detail view ── */
  .detail-view { display: none; }
  .detail-view.active { display: block; }
  .list-view.hidden { display: none; }

  .detail-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 28px; gap: 14px; flex-wrap: wrap;
  }
  .detail-title { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .detail-title h1 { font-size: 1.7rem; font-weight: 800; }
  .detail-title .company { font-family: 'DM Mono', monospace; font-size: 0.8rem; color: var(--muted); }
  .detail-actions { display: flex; gap: 10px; }

  .section {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px; margin-bottom: 18px;
  }
  .section-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; gap: 10px;
  }
  .section-head h2 { font-size: 1.05rem; font-weight: 700; }
  .section-head h2 .count {
    font-family: 'DM Mono', monospace; font-size: 0.7rem;
    color: var(--muted); margin-left: 8px; font-weight: 400;
  }

  /* ── Contract / CRM grid ── */
  .contract-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px; margin-bottom: 14px;
  }
  .contract-field { display: flex; flex-direction: column; gap: 4px; }
  .contract-field .lbl {
    font-family: 'DM Mono', monospace; font-size: 0.62rem;
    color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase;
  }
  .contract-field .val {
    font-family: 'DM Mono', monospace; font-size: 0.82rem; color: var(--text);
  }
  .contract-field .val.empty { color: var(--muted); opacity: 0.5; font-style: italic; }
  .contract-field a { color: var(--accent2); text-decoration: none; }
  .contract-field a:hover { text-decoration: underline; }
  .scope-block {
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
    font-family: 'DM Mono', monospace; font-size: 0.78rem;
    color: var(--text); line-height: 1.7; white-space: pre-wrap;
  }
  .scope-label {
    font-family: 'DM Mono', monospace; font-size: 0.62rem;
    color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase;
    margin-bottom: 6px;
  }

  /* ── Contact section ── */
  .contact-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  .contact-field { display: flex; flex-direction: column; gap: 4px; }
  .contact-field .lbl {
    font-family: 'DM Mono', monospace; font-size: 0.62rem;
    color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase;
  }
  .contact-field .val {
    font-family: 'DM Mono', monospace; font-size: 0.82rem;
    color: var(--text); word-break: break-word;
  }
  .contact-field .val.empty { color: var(--muted); opacity: 0.5; font-style: italic; }
  .contact-field a { color: var(--accent2); text-decoration: none; }
  .contact-field a:hover { text-decoration: underline; }
  .notes-block {
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
    font-family: 'DM Mono', monospace; font-size: 0.78rem;
    color: var(--text); line-height: 1.6; white-space: pre-wrap;
  }

  /* ── Support contracts ── */
  .hours-bar-wrap {
    width: 80px; height: 6px;
    background: var(--border); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 6px;
  }
  .hours-bar-fill {
    height: 100%; border-radius: 3px;
    transition: width 0.3s;
  }
  .hours-ok   { background: var(--accent); }
  .hours-low  { background: #e8c840; }
  .hours-gone { background: var(--warn); }

  /* ── Login groups ── */
  .login-group { margin-bottom: 18px; }
  .login-group:last-child { margin-bottom: 0; }
  .login-group-header {
    font-family: 'DM Mono', monospace; font-size: 0.68rem;
    color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase;
    padding: 6px 0 8px; border-bottom: 1px solid var(--border);
    margin-bottom: 0;
  }
  .login-group-header .grp-count { color: var(--muted); opacity: 0.6; }

  /* ── Tables ── */
  .data-table { width: 100%; border-collapse: collapse; }
  .data-table th {
    text-align: left; font-family: 'DM Mono', monospace; font-size: 0.62rem;
    color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase;
    padding: 8px 12px; border-bottom: 1px solid var(--border);
  }
  .data-table td {
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    font-family: 'DM Mono', monospace; font-size: 0.78rem; vertical-align: middle;
  }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table tr:hover td { background: rgba(79,255,176,0.025); }
  .row-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
  .pw-mask { letter-spacing: 0.15em; color: var(--muted); }
  .pw-shown { color: var(--accent); }
  .icon-btn {
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); border-radius: 5px; padding: 3px 8px;
    cursor: pointer; font-size: 0.72rem;
    transition: color 0.15s, border-color 0.15s;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }

  .empty-row {
    text-align: center; padding: 18px 12px;
    font-family: 'DM Mono', monospace; font-size: 0.74rem;
    color: var(--muted); font-style: italic;
  }

  /* ── Empty / loading ── */
  .state-msg {
    text-align: center; padding: 60px 20px;
    font-family: 'DM Mono', monospace; color: var(--muted); font-size: 0.85rem;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
  }
  .state-msg .big { font-size: 2.5rem; margin-bottom: 12px; }

  /* ── Modal ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); z-index: 200;
    align-items: flex-start; justify-content: center;
    padding: 40px 20px; overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 14px; padding: 36px; width: 100%; max-width: 620px; margin: 0 auto;
  }
  .modal h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: 24px; }
  .modal h2 span { color: var(--accent); }
  .modal-section-label {
    font-family: 'DM Mono', monospace; font-size: 0.64rem;
    color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase;
    border-bottom: 1px solid var(--border); padding-bottom: 6px;
    margin: 20px 0 14px;
  }
  .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .form-group label { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .form-group input, .form-group select, .form-group textarea {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 14px; color: var(--text);
    font-family: 'DM Mono', monospace; font-size: 0.82rem; transition: border-color 0.15s;
    width: 100%;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }
  .form-group textarea { resize: vertical; min-height: 90px; }
  .password-wrap { display: flex; gap: 8px; }
  .password-wrap input { flex: 1; }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

  /* ── Toast ── */
  #toast {
    position: fixed; bottom: 28px; right: 28px;
    background: var(--accent); color: #000;
    font-family: 'DM Mono', monospace; font-size: 0.8rem;
    padding: 12px 20px; border-radius: 8px;
    transform: translateY(80px); opacity: 0;
    transition: all 0.3s; z-index: 999;
  }
  #toast.show { transform: translateY(0); opacity: 1; }

  /* ── Section divider label ── */
  .section-divider {
    font-family: 'DM Mono', monospace; font-size: 0.6rem;
    color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase;
    margin: 0 0 6px; opacity: 0.7;
  }

  @media (max-width: 640px) {
    main { padding: 20px; }
    header { padding: 20px; }
    .form-row, .form-row-3 { grid-template-columns: 1fr; }
    .data-table th:nth-child(3), .data-table td:nth-child(3) { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <a class="back-link" href="javascript:history.back()">← Back</a>
    <div class="logo">RMT<span>/</span>Networks</div>
  </div>
  <div class="header-right">
    <button class="btn btn-primary" id="add-client-btn" onclick="openClientModal()">+ Add Client</button>
  </div>
</header>

<main>
  <!-- LIST VIEW -->
  <div id="list-view" class="list-view">
    <div class="page-title">
      <span class="icon">👥</span>
      <h1>Clients</h1>
    </div>
    <div class="toolbar">
      <input class="search-input" id="search" placeholder="Search by name, company, email..." oninput="renderList()">
      <select class="filter-select" id="filter-status" onchange="renderList()">
        <option value="">All Statuses</option>
        <option value="active">Active</option>
        <option value="paused">Paused</option>
        <option value="former">Former</option>
      </select>
    </div>
    <div id="clients-grid">
      <div class="state-msg"><div class="big">⟳</div>Loading...</div>
    </div>
  </div>

  <!-- DETAIL VIEW -->
  <div id="detail-view" class="detail-view">
    <div class="detail-head">
      <div class="detail-title">
        <button class="btn btn-ghost" onclick="closeDetail()">← Back</button>
        <h1 id="d-name">—</h1>
        <span class="company" id="d-company"></span>
        <span class="status-badge" id="d-status">—</span>
      </div>
      <div class="detail-actions">
        <button class="btn btn-ghost" onclick="editCurrentClient()">Edit Client</button>
        <button class="btn btn-danger" onclick="deleteCurrentClient()">Delete</button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="detail-tabs">
      <button class="tab-btn active" data-tab="overview" onclick="switchTab('overview')">Overview</button>
      <button class="tab-btn" data-tab="logins" onclick="switchTab('logins')">Logins &amp; Subscriptions</button>
    </div>

    <!-- OVERVIEW TAB -->
    <div id="tab-overview" class="tab-panel active">

      <!-- 1. Monthly Costs -->
      <div class="section" id="d-spend-section" style="display:none">
        <div class="section-head"><h2>Monthly Costs</h2></div>
        <div id="d-spend-summary"></div>
      </div>

      <!-- Stripe Income -->
      <div class="section" id="d-stripe-section" style="display:none">
        <div class="section-head">
          <h2>Income <span style="font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0">— via Stripe</span></h2>
        </div>
        <div id="d-stripe-income"></div>
      </div>

      <!-- 2. Contact -->
      <div class="section">
        <div class="section-head"><h2>Contact</h2></div>
        <div class="contact-grid" id="d-contact"></div>
        <div class="notes-block" id="d-notes"></div>
      </div>

      <!-- 3. Engagement -->
      <div class="section">
        <div class="section-head"><h2>Engagement</h2></div>
        <div class="contract-grid" id="d-contract-grid"></div>
        <div id="d-scope-wrap" style="display:none">
          <div class="scope-label">Scope of Work</div>
          <div class="scope-block" id="d-scope"></div>
        </div>
      </div>

      <!-- 4. Support Contracts -->
      <div class="section">
        <div class="section-head">
          <h2>Support Contracts <span class="count" id="d-support-count"></span></h2>
          <button class="btn btn-primary btn-tiny" onclick="openSupportModal()">+ Add Contract</button>
        </div>
        <div id="d-support"></div>
      </div>

    </div><!-- /tab-overview -->

    <!-- LOGINS & SUBSCRIPTIONS TAB -->
    <div id="tab-logins" class="tab-panel">

      <!-- Logins -->
      <div class="section">
        <div class="section-head">
          <h2>Logins <span class="count" id="d-login-count"></span></h2>
          <button class="btn btn-primary btn-tiny" onclick="openLoginModal()">+ Add Login</button>
        </div>
        <div id="d-logins"></div>
      </div>

      <!-- Subscriptions -->
      <div class="section">
        <div class="section-head">
          <h2>Subscriptions <span class="count" id="d-sub-count"></span></h2>
          <button class="btn btn-primary btn-tiny" onclick="openSubModal()">+ Add Subscription</button>
        </div>
        <div id="d-subscriptions"></div>
      </div>

    </div><!-- /tab-logins -->
  </div>
</main>

<!-- ── Client modal ── -->
<div class="modal-overlay" id="client-modal">
  <div class="modal">
    <h2 id="client-modal-title">Add <span>Client</span></h2>

    <div class="modal-section-label">Contact Info</div>
    <div class="form-row">
      <div class="form-group"><label>Name *</label><input type="text" id="cf-name" placeholder="Contact name"></div>
      <div class="form-group"><label>Company</label><input type="text" id="cf-company" placeholder="Acme Inc."></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Email</label><input type="email" id="cf-email" placeholder="name@example.com"></div>
      <div class="form-group"><label>Phone</label><input type="text" id="cf-phone" placeholder="+1 555 555 5555"></div>
    </div>
    <div class="form-group"><label>Address</label><input type="text" id="cf-address" placeholder="Street, City, State, Zip"></div>
    <div class="form-row">
      <div class="form-group"><label>Website</label><input type="text" id="cf-website" placeholder="https://..."></div>
      <div class="form-group"><label>Status</label>
        <select id="cf-status">
          <option value="active">Active</option>
          <option value="paused">Paused</option>
          <option value="former">Former</option>
        </select>
      </div>
    </div>

    <div class="modal-section-label">Engagement</div>
    <div class="form-row">
      <div class="form-group"><label>Date Hired</label><input type="date" id="cf-date-hired"></div>
      <div class="form-group"><label>Contracted Rate (USD)</label><input type="number" id="cf-rate" placeholder="500.00" step="0.01" min="0"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Billing Cycle</label>
        <select id="cf-billing">
          <option value="monthly">Monthly</option>
          <option value="annually">Annually</option>
          <option value="project">Per Project</option>
          <option value="hourly">Hourly</option>
        </select>
      </div>
      <div class="form-group"><label>Contract Renewal Date</label><input type="date" id="cf-renewal"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Payment Terms</label><input type="text" id="cf-payment-terms" placeholder="e.g. Due on receipt, Net 30"></div>
      <div class="form-group"><label>Next Follow-up Date</label><input type="date" id="cf-followup"></div>
    </div>
    <div class="form-group"><label>Contract / Doc URL</label><input type="text" id="cf-contract-url" placeholder="https://docs.google.com/..."></div>
    <div class="form-group"><label>Stripe Customer Email</label><input type="email" id="cf-stripe-email" placeholder="Same email they paid with on Stripe"></div>
    <div class="form-group"><label>Scope of Work</label><textarea id="cf-scope" placeholder="Paste what was promised — deliverables, access, ongoing tasks..." style="min-height:120px"></textarea></div>

    <div class="modal-section-label">Notes</div>
    <div class="form-group"><textarea id="cf-notes" placeholder="Anything else worth remembering"></textarea></div>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('client-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveClient()">Save Client</button>
    </div>
  </div>
</div>

<!-- ── Login modal ── -->
<div class="modal-overlay" id="login-modal">
  <div class="modal">
    <h2 id="login-modal-title">Add <span>Login</span></h2>
    <div class="form-row">
      <div class="form-group"><label>App / Service *</label><input type="text" id="lf-app" placeholder="Supabase, Stripe, Resend..."></div>
      <div class="form-group"><label>Category</label>
        <input type="text" id="lf-category" placeholder="e.g. Database, Hosting, Email" list="category-options">
        <datalist id="category-options">
          <option value="Automation">
          <option value="Database">
          <option value="Design">
          <option value="DNS / Domain">
          <option value="Email">
          <option value="Hosting">
          <option value="Payments">
          <option value="AI / APIs">
          <option value="Security">
          <option value="Other">
        </datalist>
      </div>
    </div>
    <div class="form-group"><label>Username</label><input type="text" id="lf-username" placeholder="admin"></div>
    <div class="form-group">
      <label>Password <span id="lf-pwhint" style="text-transform:none;letter-spacing:0;color:var(--muted)"></span></label>
      <div class="password-wrap">
        <input type="password" id="lf-password" placeholder="••••••••••" autocomplete="new-password">
        <button class="icon-btn" type="button" onclick="togglePwInput()" id="lf-pwtoggle">👁</button>
      </div>
    </div>
    <div class="form-group"><label>URL</label><input type="text" id="lf-url" placeholder="https://login.example.com"></div>
    <div class="form-group"><label>Notes</label><textarea id="lf-notes" placeholder="2FA backup codes, MFA method, API key details..."></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('login-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveLogin()">Save Login</button>
    </div>
  </div>
</div>

<!-- ── Subscription modal ── -->
<div class="modal-overlay" id="sub-modal">
  <div class="modal">
    <h2 id="sub-modal-title">Add <span>Subscription</span></h2>
    <div class="form-row">
      <div class="form-group"><label>Service / Site *</label><input type="text" id="sf-service" placeholder="e.g. Cloudflare, Make, Stripe"></div>
      <div class="form-group"><label>Date Signed Up</label><input type="date" id="sf-signed-up"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Billing Cycle</label>
        <select id="sf-billing" onchange="onBillingChange()">
          <option value="monthly">Monthly</option>
          <option value="annually">Annually</option>
          <option value="payg">PAYG (Pay As You Go)</option>
        </select>
      </div>
      <div class="form-group"><label>Price (per cycle, USD)</label><input type="number" id="sf-price" placeholder="0.00" step="0.01" min="0" oninput="calcMonthlyCost()"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Monthly Cost (auto-calc)</label><input type="text" id="sf-monthly-cost" readonly placeholder="—" style="opacity:0.65;cursor:not-allowed"></div>
      <div class="form-group"><label>Expiration Date</label><input type="date" id="sf-expiration"></div>
    </div>
    <div class="form-group"><label>Login (email / username)</label><input type="text" id="sf-login" placeholder="account@example.com"></div>
    <div class="form-group"><label>Website URL</label><input type="text" id="sf-url" placeholder="https://..."></div>
    <div class="form-group"><label>Notes</label><textarea id="sf-notes" placeholder="API keys, account IDs, anything useful..."></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('sub-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveSubscription()">Save Subscription</button>
    </div>
  </div>
</div>

<!-- ── Support contract modal ── -->
<div class="modal-overlay" id="support-modal">
  <div class="modal">
    <h2 id="support-modal-title">Add <span>Support Contract</span></h2>
    <div class="form-row">
      <div class="form-group"><label>Purchase Date</label><input type="date" id="sc-date"></div>
      <div class="form-group"><label>Hours Purchased</label><input type="number" id="sc-hours" placeholder="10" step="0.5" min="0.5"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Rate per Hour (USD)</label><input type="number" id="sc-rate" placeholder="100.00" step="0.01" min="0"></div>
      <div class="form-group"><label>Hours Used</label><input type="number" id="sc-used" placeholder="0" step="0.5" min="0"></div>
    </div>
    <div class="form-group"><label>Notes</label><textarea id="sc-notes" placeholder="What this contract covers, any special terms..."></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('support-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveSupportContract()">Save Contract</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  let SUPABASE_URL = '', SUPABASE_KEY = '';
  let allClients = [];
  let currentClient = null;
  let currentLogins = [];
  let currentSubscriptions = [];
  let currentSupportContracts = [];
  let editingClientId = null;
  let editingLoginId = null;
  let editingSubId = null;
  let editingSupportId = null;

  const SESSION = sessionStorage.getItem('rmt_session') || '';

  async function initConfig() {
    const res = await fetch('/.netlify/functions/config');
    const cfg = await res.json();
    SUPABASE_URL = cfg.supabaseUrl;
    SUPABASE_KEY = cfg.supabaseKey;
  }

  function sbHeaders() {
    return {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
    };
  }

  // ── Listing ──────────────────────────────────────────────────────
  async function loadClients() {
    await initConfig();
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/clients?select=*,client_logins(id),client_subscriptions(id,price,billing_cycle)&order=name.asc`,
        { headers: sbHeaders() }
      );
      if (!res.ok) throw new Error(await res.text());
      allClients = await res.json();
      renderList();
    } catch (e) {
      document.getElementById('clients-grid').innerHTML =
        `<div class="state-msg"><div class="big">⚠</div>Could not load clients.<br>${escapeHtml(e.message)}</div>`;
    }
  }

  function renderList() {
    const q  = (document.getElementById('search').value || '').toLowerCase().trim();
    const st = document.getElementById('filter-status').value;
    const filtered = allClients.filter(c => {
      if (st && c.status !== st) return false;
      if (q) {
        const hay = [c.name, c.company, c.email, c.phone].filter(Boolean).join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    const grid = document.getElementById('clients-grid');
    if (filtered.length === 0) {
      grid.innerHTML = `<div class="state-msg"><div class="big">👥</div>No clients yet — add the first one!</div>`;
      return;
    }
    grid.innerHTML = `<div class="clients-grid">${filtered.map(c => {
      const sClass = `status-${c.status || 'active'}`;
      const loginCount = (c.client_logins || []).length;
      const subCount   = (c.client_subscriptions || []).length;
      const monthlyTotal = (c.client_subscriptions || []).reduce((sum, s) => {
        if (!s.price) return sum;
        return sum + (s.billing_cycle === 'annually' ? parseFloat(s.price) / 12 : parseFloat(s.price));
      }, 0);

      return `
        <div class="client-card" onclick="openDetail('${c.id}')">
          <div class="client-card-head">
            <div>
              <div class="client-name">${escapeHtml(c.name || '—')}</div>
              ${c.company ? `<div class="client-company">${escapeHtml(c.company)}</div>` : ''}
            </div>
            <span class="status-badge ${sClass}">${c.status || 'active'}</span>
          </div>
          <div class="client-meta">
            ${c.email ? `<div class="line"><span class="icon">✉</span>${escapeHtml(c.email)}</div>` : ''}
            ${c.phone ? `<div class="line"><span class="icon">☎</span>${escapeHtml(c.phone)}</div>` : ''}
            ${c.contracted_monthly_rate ? `<div class="line" style="color:var(--accent)"><span class="icon">$</span>${formatRate(c.contracted_monthly_rate, c.contract_billing_cycle)}</div>` : ''}
          </div>
          <div class="client-card-footer">
            <div class="footer-counts">
              <span>🔑 ${loginCount}</span>
              <span>💳 ${subCount}</span>
              ${monthlyTotal > 0 ? `<span style="color:var(--muted)">$${monthlyTotal.toFixed(2)}/mo costs</span>` : ''}
            </div>
            <span style="color:var(--accent)">Open →</span>
          </div>
        </div>`;
    }).join('')}</div>`;
  }

  function formatRate(rate, cycle) {
    const r = parseFloat(rate);
    if (!r) return '—';
    switch (cycle) {
      case 'annually': return `$${r.toFixed(2)}/yr`;
      case 'project':  return `$${r.toFixed(2)} project`;
      case 'hourly':   return `$${r.toFixed(2)}/hr`;
      default:         return `$${r.toFixed(2)}/mo`;
    }
  }

  // ── Detail view ──────────────────────────────────────────────────
  async function openDetail(id) {
    currentClient = allClients.find(c => c.id === id);
    if (!currentClient) return;
    document.getElementById('list-view').classList.add('hidden');
    document.getElementById('detail-view').classList.add('active');
    document.getElementById('add-client-btn').style.display = 'none';
    switchTab('overview');
    renderDetailHead();
    renderContract();
    renderContact();
    await loadChildren();
    loadStripeIncome();
  }

  function closeDetail() {
    currentClient = null;
    document.getElementById('detail-view').classList.remove('active');
    document.getElementById('list-view').classList.remove('hidden');
    document.getElementById('add-client-btn').style.display = '';
  }

  function renderDetailHead() {
    const c = currentClient;
    document.getElementById('d-name').textContent = c.name || '—';
    document.getElementById('d-company').textContent = c.company || '';
    const badge = document.getElementById('d-status');
    badge.textContent = c.status || 'active';
    badge.className = `status-badge status-${c.status || 'active'}`;
  }

  function renderContract() {
    const c = currentClient;
    const fields = [
      { lbl: 'Date Hired',     val: c.date_hired              || null },
      { lbl: 'Contracted Rate',val: c.contracted_monthly_rate  ? formatRate(c.contracted_monthly_rate, c.contract_billing_cycle) : null },
      { lbl: 'Billing',        val: c.contract_billing_cycle   ? capitalize(c.contract_billing_cycle) : null },
      { lbl: 'Renewal Date',   val: c.contract_renewal_date   || null },
      { lbl: 'Payment Terms',  val: c.payment_terms           || null },
      { lbl: 'Next Follow-up', val: c.next_followup_date      || null },
    ];
    const linkField = c.contract_url
      ? `<div class="contract-field"><span class="lbl">Contract / Doc</span><span class="val"><a href="${escapeHtml(c.contract_url)}" target="_blank" rel="noopener">Open Document ↗</a></span></div>`
      : '';

    document.getElementById('d-contract-grid').innerHTML =
      fields.map(f => `
        <div class="contract-field">
          <span class="lbl">${f.lbl}</span>
          <span class="val ${f.val ? '' : 'empty'}">${f.val ? escapeHtml(f.val) : '—'}</span>
        </div>`).join('') + linkField;

    const scopeWrap = document.getElementById('d-scope-wrap');
    const scopeEl   = document.getElementById('d-scope');
    if (c.scope_of_work) {
      scopeWrap.style.display = '';
      scopeEl.textContent = c.scope_of_work;
    } else {
      scopeWrap.style.display = 'none';
    }
  }

  function renderContact() {
    const c = currentClient;
    const fields = [
      { lbl: 'Email',   val: c.email   ? `<a href="mailto:${c.email}">${escapeHtml(c.email)}</a>` : null },
      { lbl: 'Phone',   val: c.phone   ? `<a href="tel:${c.phone}">${escapeHtml(c.phone)}</a>` : null },
      { lbl: 'Website', val: c.website ? `<a href="${c.website}" target="_blank" rel="noopener">${escapeHtml(c.website)}</a>` : null },
      { lbl: 'Address', val: c.address ? escapeHtml(c.address) : null },
    ];
    document.getElementById('d-contact').innerHTML = fields.map(f =>
      `<div class="contact-field">
         <span class="lbl">${f.lbl}</span>
         <span class="val ${f.val ? '' : 'empty'}">${f.val || '—'}</span>
       </div>`
    ).join('');
    const notes = document.getElementById('d-notes');
    if (c.notes) { notes.style.display = ''; notes.textContent = c.notes; }
    else { notes.style.display = 'none'; }
  }

  async function loadStripeIncome() {
    const email   = currentClient?.stripe_customer_email;
    const section = document.getElementById('d-stripe-section');
    const box     = document.getElementById('d-stripe-income');
    if (!email) { section.style.display = 'none'; return; }

    section.style.display = '';
    box.innerHTML = `<div style="font-family:'DM Mono',monospace;font-size:0.75rem;color:var(--muted)">Loading...</div>`;

    try {
      const res = await fetch(`/.netlify/functions/stripe-client?email=${encodeURIComponent(email)}`, {
        headers: { Authorization: `Bearer ${SESSION}` },
      });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();

      if (!data.found) {
        box.innerHTML = `<div style="font-family:'DM Mono',monospace;font-size:0.75rem;color:var(--muted);font-style:italic">No Stripe customer found for ${escapeHtml(email)}</div>`;
        return;
      }

      const fmt = cents => `$${(cents / 100).toFixed(2)}`;
      const recentRows = data.payments.slice(0, 10).map(p => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)">
          <span style="font-family:'DM Mono',monospace;font-size:0.72rem;color:var(--muted)">${p.date}${p.description ? ' — ' + escapeHtml(p.description) : ''}</span>
          <span style="font-family:'DM Mono',monospace;font-size:0.78rem;color:var(--accent)">${fmt(p.amount_cents)}</span>
        </div>`).join('');

      box.innerHTML = `
        <div style="display:flex;gap:28px;flex-wrap:wrap;margin-bottom:16px">
          <div>
            <div style="font-family:'DM Mono',monospace;font-size:0.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px">This Month</div>
            <div style="font-family:'DM Mono',monospace;font-size:1.8rem;font-weight:500;color:var(--accent)">${fmt(data.this_month_cents)}</div>
          </div>
          <div>
            <div style="font-family:'DM Mono',monospace;font-size:0.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px">Total Lifetime</div>
            <div style="font-family:'DM Mono',monospace;font-size:1.8rem;font-weight:500;color:var(--text)">${fmt(data.total_cents)}</div>
          </div>
        </div>
        ${recentRows || '<div style="font-family:\'DM Mono\',monospace;font-size:0.75rem;color:var(--muted);font-style:italic">No payments on record</div>'}
        ${data.payments.length > 10 ? `<div style="font-family:'DM Mono',monospace;font-size:0.68rem;color:var(--muted);margin-top:8px">Showing 10 of ${data.payments.length} payments</div>` : ''}`;
    } catch (e) {
      box.innerHTML = `<div style="font-family:'DM Mono',monospace;font-size:0.75rem;color:var(--warn)">Could not load: ${escapeHtml(e.message)}</div>`;
    }
  }

  async function loadChildren() {
    if (!currentClient) return;
    const cid = currentClient.id;
    try {
      const [lgnRes, subRes, supRes] = await Promise.all([
        fetch(`/.netlify/functions/logins?client_id=${cid}`, { headers: { Authorization: `Bearer ${SESSION}` } }),
        fetch(`${SUPABASE_URL}/rest/v1/client_subscriptions?client_id=eq.${cid}&order=service.asc`, { headers: sbHeaders() }),
        fetch(`${SUPABASE_URL}/rest/v1/client_support_contracts?client_id=eq.${cid}&order=purchased_date.desc`, { headers: sbHeaders() }),
      ]);
      currentLogins            = lgnRes.ok ? await lgnRes.json() : [];
      currentSubscriptions     = subRes.ok ? await subRes.json() : [];
      currentSupportContracts  = supRes.ok ? await supRes.json() : [];
    } catch {
      currentLogins = []; currentSubscriptions = []; currentSupportContracts = [];
    }
    renderLogins();
    renderSubscriptions();
    renderSupportContracts();
  }

  function renderLogins() {
    document.getElementById('d-login-count').textContent = `(${currentLogins.length})`;
    const box = document.getElementById('d-logins');
    if (currentLogins.length === 0) {
      box.innerHTML = `<div class="empty-row">No logins yet</div>`;
      return;
    }

    // Group by category
    const groups = {};
    for (const l of currentLogins) {
      const cat = l.category || 'Other';
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(l);
    }
    const sortedCats = Object.keys(groups).sort((a, b) => {
      if (a === 'Other') return 1;
      if (b === 'Other') return -1;
      return a.localeCompare(b);
    });

    box.innerHTML = sortedCats.map(cat => `
      <div class="login-group">
        <div class="login-group-header">${escapeHtml(cat)} <span class="grp-count">(${groups[cat].length})</span></div>
        <table class="data-table">
          <thead><tr>
            <th>App</th><th>Username</th><th>Password</th><th>URL</th><th></th>
          </tr></thead>
          <tbody>
            ${groups[cat].map(l => `
              <tr>
                <td><strong>${escapeHtml(l.app || '')}</strong></td>
                <td>${escapeHtml(l.username || '—')}</td>
                <td id="pw-cell-${l.id}">
                  ${l.has_password
                    ? `<span class="pw-mask">●●●●●●●●</span>
                       <button class="icon-btn" style="margin-left:8px" onclick="revealPassword('${l.id}')">👁 Show</button>`
                    : '<span style="color:var(--muted)">—</span>'}
                </td>
                <td>${l.url ? `<a href="${l.url}" target="_blank" rel="noopener" style="color:var(--accent2)">${escapeHtml(l.url)}</a>` : '—'}</td>
                <td><div class="row-actions">
                  <button class="icon-btn" onclick="editLogin('${l.id}')">Edit</button>
                  <button class="icon-btn" onclick="deleteLogin('${l.id}')" style="color:var(--warn);border-color:var(--warn)">Del</button>
                </div></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`).join('');
  }

  function renderSupportContracts() {
    document.getElementById('d-support-count').textContent = `(${currentSupportContracts.length})`;
    const box = document.getElementById('d-support');
    if (currentSupportContracts.length === 0) {
      box.innerHTML = `<div class="empty-row">No support contracts yet</div>`;
      return;
    }
    box.innerHTML = `
      <table class="data-table">
        <thead><tr>
          <th>Purchased</th><th>Hours</th><th>Rate</th><th>Value</th><th>Progress</th><th></th>
        </tr></thead>
        <tbody>
          ${currentSupportContracts.map(sc => {
            const bought  = parseFloat(sc.hours_purchased);
            const used    = parseFloat(sc.hours_used || 0);
            const remain  = Math.max(0, bought - used);
            const pct     = bought > 0 ? Math.min(100, (used / bought) * 100) : 0;
            const barClass = pct >= 90 ? 'hours-gone' : pct >= 70 ? 'hours-low' : 'hours-ok';
            const value   = bought * parseFloat(sc.rate_per_hour);
            return `
              <tr>
                <td>${sc.purchased_date || '—'}</td>
                <td>${bought}h</td>
                <td>$${parseFloat(sc.rate_per_hour).toFixed(2)}/hr</td>
                <td>$${value.toFixed(2)}</td>
                <td>
                  <div style="display:flex;align-items:center;gap:8px">
                    <div class="hours-bar-wrap"><div class="hours-bar-fill ${barClass}" style="width:${pct.toFixed(0)}%"></div></div>
                    <span style="font-size:0.7rem;color:${remain < 2 ? 'var(--warn)' : 'var(--muted)'}">${remain.toFixed(1)}h left</span>
                  </div>
                  ${sc.notes ? `<div style="font-size:0.65rem;color:var(--muted);margin-top:3px">${escapeHtml(sc.notes)}</div>` : ''}
                </td>
                <td><div class="row-actions">
                  <button class="icon-btn" onclick="logHours('${sc.id}', 0.5)">+½h</button>
                  <button class="icon-btn" onclick="logHours('${sc.id}', 1)">+1h</button>
                  <button class="icon-btn" onclick="editSupport('${sc.id}')">Edit</button>
                  <button class="icon-btn" onclick="deleteSupport('${sc.id}')" style="color:var(--warn);border-color:var(--warn)">Del</button>
                </div></td>
              </tr>`;
          }).join('')}
        </tbody>
      </table>`;
  }

  function renderSubscriptions() {
    document.getElementById('d-sub-count').textContent = `(${currentSubscriptions.length})`;
    const box = document.getElementById('d-subscriptions');
    if (currentSubscriptions.length === 0) {
      box.innerHTML = `<div class="empty-row">No subscriptions yet</div>`;
      return;
    }
    box.innerHTML = `
      <table class="data-table">
        <thead><tr>
          <th>Service</th><th>Signed Up</th><th>Billing</th><th>Price</th><th>Monthly</th><th>Expires</th><th>Login</th><th></th>
        </tr></thead>
        <tbody>
          ${currentSubscriptions.map(s => {
            const monthly = s.price != null
              ? (s.billing_cycle === 'annually' ? s.price / 12 : parseFloat(s.price))
              : null;
            const expiring = s.expiration_date
              ? (new Date(s.expiration_date) - new Date()) / 86400000 <= 30
              : false;
            return `
              <tr>
                <td><strong>${escapeHtml(s.service || '')}</strong>${s.website_url ? ` <a href="${s.website_url}" target="_blank" rel="noopener" style="color:var(--accent2);margin-left:6px">↗</a>` : ''}</td>
                <td>${s.signed_up_date || '—'}</td>
                <td><span class="status-badge" style="background:${s.billing_cycle === 'annually' ? 'rgba(75,143,255,0.12);color:var(--accent2)' : s.billing_cycle === 'payg' ? 'rgba(255,107,74,0.15);color:var(--warn)' : 'rgba(79,255,176,0.1);color:var(--accent)'}">${s.billing_cycle === 'annually' ? 'Annual' : s.billing_cycle === 'payg' ? 'PAYG' : 'Monthly'}</span></td>
                <td>${s.price != null ? `$${parseFloat(s.price).toFixed(2)}${s.billing_cycle === 'annually' ? '/yr' : '/mo'}` : '—'}</td>
                <td>${monthly != null ? `<span style="color:var(--accent)">$${monthly.toFixed(2)}/mo</span>` : '—'}</td>
                <td><span${expiring ? ' style="color:var(--warn)"' : ''}>${s.expiration_date || '—'}</span></td>
                <td>${escapeHtml(s.login || '—')}</td>
                <td><div class="row-actions">
                  <button class="icon-btn" onclick="editSubscription('${s.id}')">Edit</button>
                  <button class="icon-btn" onclick="deleteSubscription('${s.id}')" style="color:var(--warn);border-color:var(--warn)">Del</button>
                </div></td>
              </tr>`;
          }).join('')}
        </tbody>
      </table>`;
    updateSubSummary();
  }

  function updateSubSummary() {
    const section = document.getElementById('d-spend-section');
    const box = document.getElementById('d-spend-summary');
    if (currentSubscriptions.length === 0) { section.style.display = 'none'; return; }
    const total = currentSubscriptions.reduce((sum, s) => {
      if (!s.price) return sum;
      return sum + (s.billing_cycle === 'annually' ? parseFloat(s.price) / 12 : parseFloat(s.price));
    }, 0);
    section.style.display = '';
    box.innerHTML = `
      <div style="display:flex;align-items:baseline;gap:16px;flex-wrap:wrap">
        <span style="font-family:'DM Mono',monospace;font-size:2rem;font-weight:500;color:var(--warn)">$${total.toFixed(2)}<span style="font-size:1rem;opacity:0.7">/mo</span></span>
        <span style="font-family:'DM Mono',monospace;font-size:0.75rem;color:var(--muted)">${currentSubscriptions.length} subscription${currentSubscriptions.length !== 1 ? 's' : ''}</span>
      </div>`;
  }

  // ── Support contract CRUD ─────────────────────────────────────────
  function openSupportModal(id = null) {
    editingSupportId = id;
    document.getElementById('support-modal-title').innerHTML = id ? 'Edit <span>Support Contract</span>' : 'Add <span>Support Contract</span>';
    const sc = id ? currentSupportContracts.find(x => x.id === id) : {};
    const today = new Date();
    const pad = n => String(n).padStart(2, '0');
    document.getElementById('sc-date').value  = sc?.purchased_date  || `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
    document.getElementById('sc-hours').value = sc?.hours_purchased ?? 10;
    document.getElementById('sc-rate').value  = sc?.rate_per_hour   ?? 100;
    document.getElementById('sc-used').value  = sc?.hours_used      ?? 0;
    document.getElementById('sc-notes').value = sc?.notes           || '';
    openModal('support-modal');
  }
  function editSupport(id) { openSupportModal(id); }

  async function saveSupportContract() {
    const hours = parseFloat(document.getElementById('sc-hours').value);
    const used  = parseFloat(document.getElementById('sc-used').value  || '0');
    if (!hours || hours <= 0) { toast('Hours purchased required', true); return; }
    if (used > hours)         { toast('Hours used cannot exceed hours purchased', true); return; }
    const payload = {
      client_id:       currentClient.id,
      purchased_date:  document.getElementById('sc-date').value  || null,
      hours_purchased: hours,
      rate_per_hour:   parseFloat(document.getElementById('sc-rate').value) || 100,
      hours_used:      used,
      notes:           document.getElementById('sc-notes').value.trim() || null,
    };
    try {
      let res;
      if (editingSupportId) {
        const { client_id, ...patch } = payload;
        res = await fetch(`${SUPABASE_URL}/rest/v1/client_support_contracts?id=eq.${editingSupportId}`, { method: 'PATCH', headers: sbHeaders(), body: JSON.stringify(patch) });
      } else {
        res = await fetch(`${SUPABASE_URL}/rest/v1/client_support_contracts`, { method: 'POST', headers: sbHeaders(), body: JSON.stringify(payload) });
      }
      if (!res.ok) throw new Error(await res.text());
      closeModal('support-modal');
      await loadChildren();
      await loadClients();
      toast(editingSupportId ? 'Contract updated' : 'Contract saved');
    } catch (e) { toast('Error: ' + e.message, true); }
  }

  async function logHours(id, increment) {
    const sc = currentSupportContracts.find(x => x.id === id);
    if (!sc) return;
    const newUsed = Math.min(parseFloat(sc.hours_used || 0) + increment, parseFloat(sc.hours_purchased));
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/client_support_contracts?id=eq.${id}`, {
        method: 'PATCH', headers: sbHeaders(), body: JSON.stringify({ hours_used: newUsed }),
      });
      if (!res.ok) throw new Error(await res.text());
      await loadChildren();
      await loadClients();
      toast(`Logged ${increment}h`);
    } catch (e) { toast('Error: ' + e.message, true); }
  }

  async function deleteSupport(id) {
    if (!confirm('Delete this support contract?')) return;
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/client_support_contracts?id=eq.${id}`, { method: 'DELETE', headers: sbHeaders() });
      if (!res.ok) throw new Error(await res.text());
      await loadChildren();
      await loadClients();
      toast('Deleted');
    } catch (e) { toast('Error: ' + e.message, true); }
  }

  // ── Subscription CRUD ────────────────────────────────────────────
  function calcMonthlyCost() {
    const price = parseFloat(document.getElementById('sf-price').value);
    const billing = document.getElementById('sf-billing').value;
    const el = document.getElementById('sf-monthly-cost');
    if (isNaN(price) || price === 0) { el.value = '—'; return; }
    const monthly = billing === 'annually' ? price / 12 : price;
    el.value = `$${monthly.toFixed(2)}/mo`;
  }

  function setDefaultExpiration(billing, base) {
    const d = new Date(base);
    if (billing === 'monthly') d.setDate(d.getDate() + 30);
    else if (billing === 'annually') d.setFullYear(d.getFullYear() + 1);
    else { document.getElementById('sf-expiration').value = ''; return; }
    const pad = n => String(n).padStart(2, '0');
    document.getElementById('sf-expiration').value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }

  function onBillingChange() {
    calcMonthlyCost();
    if (!editingSubId) {
      const signedUp = document.getElementById('sf-signed-up').value;
      const base = signedUp ? new Date(signedUp + 'T00:00:00') : new Date();
      setDefaultExpiration(document.getElementById('sf-billing').value, base);
    }
  }

  function openSubModal(id = null) {
    editingSubId = id;
    document.getElementById('sub-modal-title').innerHTML = id ? 'Edit <span>Subscription</span>' : 'Add <span>Subscription</span>';
    const s = id ? currentSubscriptions.find(x => x.id === id) : {};
    document.getElementById('sf-service').value = s?.service       || '';
    document.getElementById('sf-billing').value = s?.billing_cycle || 'monthly';
    document.getElementById('sf-price').value   = s?.price         ?? '';
    document.getElementById('sf-login').value   = s?.login         || '';
    document.getElementById('sf-url').value     = s?.website_url   || '';
    document.getElementById('sf-notes').value   = s?.notes         || '';
    if (id) {
      document.getElementById('sf-signed-up').value  = s?.signed_up_date  || '';
      document.getElementById('sf-expiration').value = s?.expiration_date || '';
    } else {
      const today = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('sf-signed-up').value = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
      setDefaultExpiration('monthly', today);
    }
    calcMonthlyCost();
    openModal('sub-modal');
  }
  function editSubscription(id) { openSubModal(id); }

  async function saveSubscription() {
    const service = document.getElementById('sf-service').value.trim();
    if (!service) { toast('Service name is required', true); return; }
    const priceRaw = document.getElementById('sf-price').value.trim();
    const payload = {
      client_id:       currentClient.id,
      service,
      signed_up_date:  document.getElementById('sf-signed-up').value    || null,
      billing_cycle:   document.getElementById('sf-billing').value,
      price:           priceRaw ? parseFloat(priceRaw) : null,
      expiration_date: document.getElementById('sf-expiration').value   || null,
      login:           document.getElementById('sf-login').value.trim() || null,
      website_url:     document.getElementById('sf-url').value.trim()   || null,
      notes:           document.getElementById('sf-notes').value.trim() || null,
    };
    try {
      let res;
      if (editingSubId) {
        const { client_id, ...patch } = payload;
        res = await fetch(`${SUPABASE_URL}/rest/v1/client_subscriptions?id=eq.${editingSubId}`, { method: 'PATCH', headers: sbHeaders(), body: JSON.stringify(patch) });
      } else {
        res = await fetch(`${SUPABASE_URL}/rest/v1/client_subscriptions`, { method: 'POST', headers: sbHeaders(), body: JSON.stringify(payload) });
      }
      if (!res.ok) throw new Error(await res.text());
      closeModal('sub-modal');
      await loadChildren();
      await loadClients();
      toast(editingSubId ? 'Subscription updated' : 'Subscription saved');
    } catch (e) { toast('Error: ' + e.message, true); }
  }

  async function deleteSubscription(id) {
    const s = currentSubscriptions.find(x => x.id === id);
    if (!confirm(`Delete subscription "${s.service}"?`)) return;
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/client_subscriptions?id=eq.${id}`, { method: 'DELETE', headers: sbHeaders() });
      if (!res.ok) throw new Error(await res.text());
      await loadChildren();
      await loadClients();
      toast('Deleted');
    } catch (e) { toast('Error: ' + e.message, true); }
  }

  // ── Password reveal ──────────────────────────────────────────────
  async function revealPassword(id) {
    const cell = document.getElementById('pw-cell-' + id);
    try {
      const res = await fetch(`/.netlify/functions/logins?reveal=${id}`, { headers: { Authorization: `Bearer ${SESSION}` } });
      if (!res.ok) throw new Error(await res.text());
      const { password } = await res.json();
      cell.innerHTML = `
        <span class="pw-shown">${escapeHtml(password)}</span>
        <button class="icon-btn" style="margin-left:8px" onclick="copyToClipboard(\`${password.replace(/`/g,'\\`')}\`)">Copy</button>
        <button class="icon-btn" style="margin-left:4px" onclick="hidePassword('${id}')">Hide</button>`;
    } catch (e) { toast('Reveal failed: ' + e.message, true); }
  }
  function hidePassword(id) {
    const l = currentLogins.find(x => x.id === id);
    if (!l) return;
    document.getElementById('pw-cell-' + id).innerHTML =
      `<span class="pw-mask">●●●●●●●●</span>
       <button class="icon-btn" style="margin-left:8px" onclick="revealPassword('${id}')">👁 Show</button>`;
  }
  async function copyToClipboard(text) {
    try { await navigator.clipboard.writeText(text); toast('Copied'); }
    catch { toast('Copy failed', true); }
  }

  // ── Client CRUD ──────────────────────────────────────────────────
  function openClientModal(id = null) {
    editingClientId = id;
    document.getElementById('client-modal-title').innerHTML = id ? 'Edit <span>Client</span>' : 'Add <span>Client</span>';
    const c = id ? allClients.find(x => x.id === id) : {};
    document.getElementById('cf-name').value          = c?.name                   || '';
    document.getElementById('cf-company').value       = c?.company                || '';
    document.getElementById('cf-email').value         = c?.email                  || '';
    document.getElementById('cf-phone').value         = c?.phone                  || '';
    document.getElementById('cf-address').value       = c?.address                || '';
    document.getElementById('cf-website').value       = c?.website                || '';
    document.getElementById('cf-status').value        = c?.status                 || 'active';
    document.getElementById('cf-date-hired').value   = c?.date_hired             || '';
    document.getElementById('cf-rate').value          = c?.contracted_monthly_rate ?? '';
    document.getElementById('cf-billing').value       = c?.contract_billing_cycle || 'monthly';
    document.getElementById('cf-renewal').value       = c?.contract_renewal_date  || '';
    document.getElementById('cf-payment-terms').value = c?.payment_terms          || '';
    document.getElementById('cf-followup').value      = c?.next_followup_date     || '';
    document.getElementById('cf-contract-url').value  = c?.contract_url           || '';
    document.getElementById('cf-stripe-email').value  = c?.stripe_customer_email  || '';
    document.getElementById('cf-scope').value         = c?.scope_of_work          || '';
    document.getElementById('cf-notes').value         = c?.notes                  || '';
    openModal('client-modal');
  }

  function editCurrentClient() { openClientModal(currentClient.id); }

  async function saveClient() {
    const name = document.getElementById('cf-name').value.trim();
    if (!name) { toast('Name is required', true); return; }
    const rateRaw = document.getElementById('cf-rate').value.trim();
    const payload = {
      name,
      company:                document.getElementById('cf-company').value.trim()       || null,
      email:                  document.getElementById('cf-email').value.trim()         || null,
      phone:                  document.getElementById('cf-phone').value.trim()         || null,
      address:                document.getElementById('cf-address').value.trim()       || null,
      website:                document.getElementById('cf-website').value.trim()       || null,
      status:                 document.getElementById('cf-status').value,
      date_hired:             document.getElementById('cf-date-hired').value           || null,
      contracted_monthly_rate: rateRaw ? parseFloat(rateRaw) : null,
      contract_billing_cycle: document.getElementById('cf-billing').value,
      contract_renewal_date:  document.getElementById('cf-renewal').value             || null,
      payment_terms:          document.getElementById('cf-payment-terms').value.trim() || null,
      next_followup_date:     document.getElementById('cf-followup').value            || null,
      contract_url:           document.getElementById('cf-contract-url').value.trim() || null,
      stripe_customer_email:  document.getElementById('cf-stripe-email').value.trim().toLowerCase() || null,
      scope_of_work:          document.getElementById('cf-scope').value.trim()        || null,
      notes:                  document.getElementById('cf-notes').value.trim()        || null,
      updated_at:             new Date().toISOString(),
    };
    try {
      let res;
      if (editingClientId) {
        res = await fetch(`${SUPABASE_URL}/rest/v1/clients?id=eq.${editingClientId}`, { method: 'PATCH', headers: sbHeaders(), body: JSON.stringify(payload) });
      } else {
        res = await fetch(`${SUPABASE_URL}/rest/v1/clients`, { method: 'POST', headers: sbHeaders(), body: JSON.stringify(payload) });
      }
      if (!res.ok) throw new Error(await res.text());
      closeModal('client-modal');
      await loadClients();
      if (currentClient && editingClientId === currentClient.id) {
        currentClient = allClients.find(c => c.id === currentClient.id) || currentClient;
        renderDetailHead(); renderContract(); renderContact();
      }
      toast(editingClientId ? 'Client updated' : 'Client saved');
    } catch (e) { toast('Error: ' + e.message, true); }
  }

  async function deleteCurrentClient() {
    if (!currentClient) return;
    if (!confirm(`Delete "${currentClient.name}" and all their data?`)) return;
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/clients?id=eq.${currentClient.id}`, { method: 'DELETE', headers: sbHeaders() });
      if (!res.ok) throw new Error(await res.text());
      closeDetail();
      await loadClients();
      toast('Client deleted');
    } catch (e) { toast('Error: ' + e.message, true); }
  }

  // ── Login CRUD ───────────────────────────────────────────────────
  function openLoginModal(id = null) {
    editingLoginId = id;
    document.getElementById('login-modal-title').innerHTML = id ? 'Edit <span>Login</span>' : 'Add <span>Login</span>';
    const l = id ? currentLogins.find(x => x.id === id) : {};
    document.getElementById('lf-app').value      = l?.app      || '';
    document.getElementById('lf-category').value = l?.category || '';
    document.getElementById('lf-username').value = l?.username || '';
    document.getElementById('lf-password').value = '';
    document.getElementById('lf-url').value      = l?.url      || '';
    document.getElementById('lf-notes').value    = l?.notes    || '';
    document.getElementById('lf-pwhint').textContent = id ? (l?.has_password ? '(leave blank to keep current)' : '') : '';
    document.getElementById('lf-password').type = 'password';
    document.getElementById('lf-pwtoggle').textContent = '👁';
    openModal('login-modal');
  }
  function editLogin(id) { openLoginModal(id); }

  function togglePwInput() {
    const inp = document.getElementById('lf-password');
    const btn = document.getElementById('lf-pwtoggle');
    if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
    else { inp.type = 'password'; btn.textContent = '👁'; }
  }

  async function saveLogin() {
    const app = document.getElementById('lf-app').value.trim();
    if (!app) { toast('App is required', true); return; }
    const pwRaw = document.getElementById('lf-password').value;
    const payload = {
      app,
      category: document.getElementById('lf-category').value.trim() || null,
      username: document.getElementById('lf-username').value.trim() || null,
      url:      document.getElementById('lf-url').value.trim()      || null,
      notes:    document.getElementById('lf-notes').value.trim()    || null,
    };
    if (pwRaw !== '') payload.password = pwRaw;
    try {
      let res;
      if (editingLoginId) {
        res = await fetch(`/.netlify/functions/logins?id=${editingLoginId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${SESSION}` },
          body: JSON.stringify(payload),
        });
      } else {
        res = await fetch(`/.netlify/functions/logins`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${SESSION}` },
          body: JSON.stringify({ ...payload, client_id: currentClient.id }),
        });
      }
      if (!res.ok) throw new Error(await res.text());
      closeModal('login-modal');
      await loadChildren();
      await loadClients();
      toast(editingLoginId ? 'Login updated' : 'Login saved');
    } catch (e) { toast('Error: ' + e.message, true); }
  }

  async function deleteLogin(id) {
    const l = currentLogins.find(x => x.id === id);
    if (!confirm(`Delete login "${l.app}"?`)) return;
    try {
      const res = await fetch(`/.netlify/functions/logins?id=${id}`, {
        method: 'DELETE', headers: { Authorization: `Bearer ${SESSION}` },
      });
      if (!res.ok) throw new Error(await res.text());
      await loadChildren();
      await loadClients();
      toast('Deleted');
    } catch (e) { toast('Error: ' + e.message, true); }
  }

  // ── Modal plumbing + utils ───────────────────────────────────────
  function openModal(id)  { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }

  document.querySelectorAll('.modal-overlay').forEach(o => {
    o.addEventListener('click', e => { if (e.target === e.currentTarget) o.classList.remove('open'); });
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.open').forEach(o => o.classList.remove('open'));
  });

  function toast(msg, err = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = err ? 'var(--warn)' : 'var(--accent)';
    t.style.color = '#000';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function capitalize(s) {
    return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === `tab-${tab}`));
  }

  loadClients();
</script>
</body>
</html>
