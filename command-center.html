<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RMT Networks — Command Center</title>
<script>
  (function() {
    var token = sessionStorage.getItem('rmt_session');
    if (!token) { window.location.replace('/'); return; }
    fetch('/.netlify/functions/verify', {
      headers: { 'Authorization': 'Bearer ' + token }
    }).then(function(r) {
      if (!r.ok) { sessionStorage.removeItem('rmt_session'); window.location.replace('/'); return; }
      r.json().then(function(d) {
        if (d && d.user) sessionStorage.setItem('rmt_user', d.user);
        document.body.style.visibility = 'visible';
      }).catch(function() { document.body.style.visibility = 'visible'; });
    }).catch(function() { document.body.style.visibility = 'visible'; });
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #0d0f14;
    --surface: #13161e;
    --border:  #1e2230;
    --accent:  #4fffb0;
    --accent2: #4b8fff;
    --warn:    #ff6b4a;
    --text:    #e8eaf0;
    --muted:   #5a6070;
    --card-bg: #181b24;
    --stage-red:    #ff5470;
    --stage-green:  #4fffb0;
    --stage-yellow: #ffd166;
    --stage-pink:   #ff7cf0;
    --stage-blue:   #4b8fff;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; min-height: 100vh; visibility: hidden; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 28px 40px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg); z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 20px; }
  .back-link {
    font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--muted);
    text-decoration: none; padding: 6px 12px;
    border: 1px solid var(--border); border-radius: 6px;
    transition: color 0.15s, border-color 0.15s;
  }
  .back-link:hover { color: var(--accent); border-color: var(--accent); }
  .logo { height: 50px; width: auto; display: block; background: #fff; padding: 8px 18px; border-radius: 12px; }

  main { max-width: 1100px; margin: 0 auto; padding: 40px; }
  .page-title { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .page-title h1 { font-size: 1.8rem; font-weight: 800; }
  .page-title .icon { font-size: 1.8rem; }

  .stats-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
  .stat-pill {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 18px;
    display: flex; flex-direction: column; gap: 3px; min-width: 130px;
  }
  .stat-pill .stat-label {
    font-family: 'DM Mono', monospace; font-size: 0.6rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .stat-pill .stat-value { font-size: 1.25rem; font-weight: 700; }

  .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 22px; flex-wrap: wrap; }
  select.filter-select {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 12px; color: var(--text);
    font-family: 'DM Mono', monospace; font-size: 0.76rem; cursor: pointer;
  }
  select:focus { outline: none; border-color: var(--accent); }

  .board { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden;
  }
  .card.stale { border-color: var(--warn); }
  .row {
    padding: 16px 20px; display: grid;
    grid-template-columns: 1.1fr auto 1.3fr 1.3fr auto auto; gap: 16px; align-items: center;
    cursor: pointer; user-select: none;
  }
  .row:hover { background: rgba(255,255,255,0.02); }
  .row-name .chevron {
    display: inline-block; margin-right: 6px; color: var(--muted);
    font-size: 0.7rem; transition: transform 0.15s;
  }
  .card.expanded .row-name .chevron { transform: rotate(90deg); }

  .detail-panel {
    display: none; padding: 0 20px 20px; border-top: 1px solid var(--border);
    grid-template-columns: 1fr 1fr; gap: 16px 24px;
  }
  .card.expanded .detail-panel { display: grid; padding-top: 16px; }
  .detail-field { font-size: 0.82rem; }
  .detail-field .detail-label {
    font-family: 'DM Mono', monospace; font-size: 0.62rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px;
  }
  .detail-field .detail-value { color: var(--text); line-height: 1.4; }
  .detail-field .detail-value.empty { color: var(--muted); font-style: italic; }
  .detail-field.full { grid-column: 1 / -1; }
  .detail-tasklist { list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .detail-tasklist li {
    font-family: 'DM Mono', monospace; font-size: 0.76rem; color: var(--text);
    display: flex; justify-content: space-between; gap: 10px;
  }
  .detail-tasklist .due { color: var(--muted); white-space: nowrap; }

  @media (max-width: 700px) {
    .detail-panel { grid-template-columns: 1fr; }
  }
  .row-name { font-weight: 700; font-size: 1rem; }
  .row-name .company { display: block; font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .row-status { font-size: 0.88rem; color: var(--text); }
  .row-status.empty { color: var(--muted); font-style: italic; }
  .row-next { font-size: 0.88rem; color: var(--text); }
  .row-next.empty { color: var(--muted); font-style: italic; }
  .row-next .col-label, .row-status .col-label {
    display: block; font-family: 'DM Mono', monospace; font-size: 0.58rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 3px;
  }
  .status-pill {
    font-family: 'DM Mono', monospace; font-size: 0.62rem; text-transform: uppercase;
    letter-spacing: 0.05em; padding: 4px 10px; border-radius: 20px;
    border: 1px solid; white-space: nowrap; font-weight: 500;
  }
  .status-pill.pill-red    { color: var(--stage-red);    border-color: var(--stage-red);    background: rgba(255,84,112,0.1); }
  .status-pill.pill-green  { color: var(--stage-green);  border-color: var(--stage-green);  background: rgba(79,255,176,0.1); }
  .status-pill.pill-yellow { color: var(--stage-yellow); border-color: var(--stage-yellow); background: rgba(255,209,102,0.1); }
  .status-pill.pill-pink   { color: var(--stage-pink);   border-color: var(--stage-pink);   background: rgba(255,124,240,0.1); }
  .status-pill.pill-blue   { color: var(--stage-blue);   border-color: var(--stage-blue);   background: rgba(75,143,255,0.1); }
  .status-pill.pill-none   { color: var(--muted); border-color: var(--border); }

  .stage-select {
    font-family: 'DM Mono', monospace; font-size: 0.62rem; text-transform: uppercase;
    letter-spacing: 0.05em; padding: 4px 8px; border-radius: 20px;
    border: 1px solid; white-space: nowrap; font-weight: 500; cursor: pointer;
  }
  .stage-select:focus { outline: none; }
  .stage-select option { background: var(--card-bg); color: var(--text); text-transform: none; }
  .stage-select.pill-red    { color: var(--stage-red);    border-color: var(--stage-red);    background-color: rgba(255,84,112,0.1); }
  .stage-select.pill-green  { color: var(--stage-green);  border-color: var(--stage-green);  background-color: rgba(79,255,176,0.1); }
  .stage-select.pill-yellow { color: var(--stage-yellow); border-color: var(--stage-yellow); background-color: rgba(255,209,102,0.1); }
  .stage-select.pill-pink   { color: var(--stage-pink);   border-color: var(--stage-pink);   background-color: rgba(255,124,240,0.1); }
  .stage-select.pill-blue   { color: var(--stage-blue);   border-color: var(--stage-blue);   background-color: rgba(75,143,255,0.1); }
  .stage-select.pill-none   { color: var(--muted); border-color: var(--border); background-color: transparent; }
  .row-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-family: 'DM Mono', monospace; font-size: 0.68rem; }
  .row-age { color: var(--muted); }
  .row-age.stale { color: var(--warn); font-weight: 500; }
  .row-tasks { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--accent2); white-space: nowrap; }
  .row-tasks.none { color: var(--muted); }
  .badge {
    font-family: 'DM Mono', monospace; font-size: 0.62rem; text-transform: uppercase;
    letter-spacing: 0.06em; padding: 3px 8px; border-radius: 5px; border: 1px solid var(--border);
    color: var(--muted); white-space: nowrap;
  }
  .badge.active  { color: var(--accent); border-color: var(--accent); }
  .badge.prospect { color: var(--accent2); border-color: var(--accent2); }

  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--muted);
    font-family: 'DM Mono', monospace; font-size: 0.85rem;
  }

  @media (max-width: 700px) {
    main { padding: 20px; }
    header { padding: 18px 20px; }
    .row { grid-template-columns: 1fr; gap: 8px; }
    .row-meta { align-items: flex-start; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <a class="back-link" href="javascript:history.back()">← Back</a>
    <img class="logo" src="/images/rmt-networks-logo.png" alt="RMT Networks">
  </div>
  <div class="header-right">
    <a class="back-link" href="/clients.html">Clients →</a>
  </div>
</header>

<main>
  <div class="page-title">
    <span class="icon">🖥️</span>
    <h1>Command Center</h1>
  </div>

  <div class="stats-bar">
    <div class="stat-pill">
      <span class="stat-label">Active Clients</span>
      <span class="stat-value" id="stat-total">0</span>
    </div>
    <div class="stat-pill">
      <span class="stat-label">Stale (7+ days)</span>
      <span class="stat-value" id="stat-stale" style="color:var(--warn)">0</span>
    </div>
    <div class="stat-pill">
      <span class="stat-label">Open Tasks</span>
      <span class="stat-value" id="stat-tasks" style="color:var(--accent2)">0</span>
    </div>
  </div>

  <div class="toolbar">
    <select class="filter-select" id="sort-by" onchange="render()">
      <option value="stale">Sort: Most stale first</option>
      <option value="name">Sort: Name</option>
    </select>
  </div>

  <div class="board" id="board"></div>
</main>

<script>
  const SESSION = sessionStorage.getItem('rmt_session') || '';
  const apiHeaders = () => ({ Authorization: `Bearer ${SESSION}` });
  let allClients = [];

  const STAGE_META = {
    pending_client:   { label: 'Pending Client',   css: 'red' },
    building:         { label: 'Building',         css: 'green' },
    on_hold:          { label: 'On-Hold',          css: 'red' },
    completed:        { label: 'Completed',        css: 'green' },
    pending_payment:  { label: 'Pending Payment',  css: 'yellow' },
    pending_delivery: { label: 'Pending Delivery', css: 'blue' },
    new_build:        { label: 'New Build',        css: 'pink' },
  };

  const expandedIds = new Set();

  function stageSelectHtml(client) {
    const current = client.project_status;
    const css = STAGE_META[current] ? STAGE_META[current].css : 'none';
    const options = [`<option value="" ${current ? '' : 'selected'}>No stage</option>`]
      .concat(Object.entries(STAGE_META).map(([key, meta]) =>
        `<option value="${key}" ${key === current ? 'selected' : ''}>${meta.label}</option>`
      )).join('');
    return `<select class="stage-select pill-${css}" onclick="event.stopPropagation()" onchange="updateProjectStatus('${client.id}', this.value, this)">${options}</select>`;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function daysAgo(iso) {
    if (!iso) return null;
    const ms = Date.now() - new Date(iso).getTime();
    return Math.floor(ms / 86400000);
  }

  async function load() {
    const res = await fetch('/.netlify/functions/clients', { headers: apiHeaders() });
    if (!res.ok) {
      document.getElementById('board').innerHTML = `<div class="empty-state">Failed to load clients (${res.status}).</div>`;
      return;
    }
    allClients = (await res.json()).filter(c => c.status === 'active');
    render();
  }

  function render() {
    const sortBy = document.getElementById('sort-by').value;

    let rows = allClients.slice();

    if (sortBy === 'name') {
      rows.sort((a, b) => a.name.localeCompare(b.name));
    } else {
      rows.sort((a, b) => {
        const ageA = a.status_updated_at ? new Date(a.status_updated_at).getTime() : -Infinity;
        const ageB = b.status_updated_at ? new Date(b.status_updated_at).getTime() : -Infinity;
        return ageA - ageB;
      });
    }

    const totalTasks = allClients.reduce((sum, c) => sum + (c.client_tasks || []).filter(t => t.status === 'open').length, 0);
    const staleCount = allClients.filter(c => {
      const d = daysAgo(c.status_updated_at);
      return d === null || d >= 7;
    }).length;

    document.getElementById('stat-total').textContent = allClients.length;
    document.getElementById('stat-stale').textContent = staleCount;
    document.getElementById('stat-tasks').textContent = totalTasks;

    const board = document.getElementById('board');
    if (rows.length === 0) {
      board.innerHTML = `<div class="empty-state">No active clients.</div>`;
      return;
    }

    board.innerHTML = rows.map(c => {
      const age = daysAgo(c.status_updated_at);
      const isStale = age === null || age >= 7;
      const ageLabel = age === null ? 'never logged' : (age === 0 ? 'today' : `${age}d ago`);
      const openTasks = (c.client_tasks || []).filter(t => t.status === 'open');
      const nextDue = openTasks
        .filter(t => t.due_date)
        .sort((a, b) => new Date(a.due_date) - new Date(b.due_date))[0];

      const d = c.status_detail || {};
      const field = (label, value) => `
        <div class="detail-field">
          <div class="detail-label">${label}</div>
          <div class="detail-value ${value ? '' : 'empty'}">${value ? escapeHtml(value) : 'Nothing logged'}</div>
        </div>
      `;

      return `
        <div class="card ${isStale ? 'stale' : ''} ${expandedIds.has(c.id) ? 'expanded' : ''}" id="card-${c.id}">
          <div class="row" onclick="toggleCard('${c.id}')">
            <div class="row-name">
              <span class="chevron">▶</span>${escapeHtml(c.name)}
              ${c.company ? `<span class="company">${escapeHtml(c.company)}</span>` : ''}
            </div>
            <div class="row-pill">${stageSelectHtml(c)}</div>
            <div class="row-status ${c.current_status ? '' : 'empty'}">
              <span class="col-label">What's up</span>
              ${c.current_status ? escapeHtml(c.current_status) : 'No status logged yet'}
            </div>
            <div class="row-next ${d.next_up ? '' : 'empty'}">
              <span class="col-label">What's next</span>
              ${d.next_up ? escapeHtml(d.next_up) : 'Nothing queued'}
            </div>
            <div class="row-tasks ${openTasks.length ? '' : 'none'}">
              ${openTasks.length ? `${openTasks.length} open task${openTasks.length === 1 ? '' : 's'}` : 'No open tasks'}
              ${nextDue ? `<br>next due ${escapeHtml(nextDue.due_date)}` : ''}
            </div>
            <div class="row-meta">
              <span class="row-age ${isStale ? 'stale' : ''}">${ageLabel}</span>
            </div>
          </div>
          <div class="detail-panel">
            ${field('Where we left off', d.last_handoff)}
            ${field("What's next", d.next_up)}
            ${field('Waiting on client', d.waiting_on)}
            ${field('Sent, awaiting response', d.sent_pending)}
            ${field('Client questions to answer', d.client_questions)}
            <div class="detail-field full">
              <div class="detail-label">Open tasks</div>
              ${openTasks.length
                ? `<ul class="detail-tasklist">${openTasks.map(t => `<li><span>${escapeHtml(t.title)}</span>${t.due_date ? `<span class="due">due ${escapeHtml(t.due_date)}</span>` : ''}</li>`).join('')}</ul>`
                : `<div class="detail-value empty">No open tasks</div>`}
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function toggleCard(id) {
    if (expandedIds.has(id)) expandedIds.delete(id);
    else expandedIds.add(id);
    document.getElementById(`card-${id}`).classList.toggle('expanded');
  }

  async function logSystemActivity(clientId, body) {
    try {
      await fetch('/.netlify/functions/client-activities', {
        method: 'POST', headers: apiHeaders(),
        body: JSON.stringify({ client_id: clientId, type: 'system', body }),
      });
    } catch { /* non-critical */ }
  }

  async function updateProjectStatus(clientId, newStatus, selectEl) {
    const client = allClients.find(c => c.id === clientId);
    if (!client) return;
    const oldStatus = client.project_status || null;
    const value = newStatus || null;
    if (oldStatus === value) return;

    selectEl.disabled = true;
    try {
      const res = await fetch(`/.netlify/functions/clients?id=${clientId}`, {
        method: 'PATCH', headers: apiHeaders(),
        body: JSON.stringify({ project_status: value }),
      });
      if (!res.ok) throw new Error(await res.text());
      const oldLabel = STAGE_META[oldStatus]?.label || 'No stage';
      const newLabel = STAGE_META[value]?.label || 'No stage';
      await logSystemActivity(clientId, `Stage changed: ${oldLabel} → ${newLabel}`);
      client.project_status = value;
      render();
    } catch (e) {
      alert('Error updating stage: ' + e.message);
      selectEl.disabled = false;
      selectEl.value = oldStatus || '';
    }
  }

  load();
</script>
</body>
</html>
