<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RMT Networks — Ideas</title>
<script>
  (function() {
    var token = sessionStorage.getItem('rmt_session');
    if (!token) { window.location.replace('/'); return; }
    fetch('/.netlify/functions/verify', {
      headers: { 'Authorization': 'Bearer ' + token }
    }).then(function(r) {
      if (!r.ok) { sessionStorage.removeItem('rmt_session'); window.location.replace('/'); }
      else { document.body.style.visibility = 'visible'; }
    }).catch(function() {
      document.body.style.visibility = 'visible';
    });
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #0d0f14;
    --surface: #13161e;
    --border:  #1e2230;
    --accent:  #4fffb0;
    --accent2: #4b8fff;
    --warn:    #ff6b4a;
    --text:    #e8eaf0;
    --muted:   #5a6070;
    --card-bg: #181b24;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    visibility: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 40px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0;
    background: var(--bg);
    z-index: 100;
  }

  .header-left { display: flex; align-items: center; gap: 20px; }
  .back-link {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    text-decoration: none;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    transition: color 0.15s, border-color 0.15s;
  }
  .back-link:hover { color: var(--accent); border-color: var(--accent); }
  .logo { font-size: 1.1rem; font-weight: 800; letter-spacing: 0.08em; color: var(--accent); }
  .logo span { color: var(--muted); font-weight: 400; }

  .btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    padding: 9px 18px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.03em;
  }
  .btn-primary { background: var(--accent); color: #000; font-weight: 500; }
  .btn-primary:hover { background: #6fffbe; transform: translateY(-1px); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: var(--muted); }
  .btn-danger { background: transparent; color: var(--warn); border: 1px solid var(--warn); font-size: 0.72rem; padding: 5px 12px; }
  .btn-danger:hover { background: var(--warn); color: #fff; }

  main { max-width: 1000px; margin: 0 auto; padding: 40px; }

  /* ── Filter/toolbar ── */
  .toolbar {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .toolbar-left { flex: 1; display: flex; gap: 12px; flex-wrap: wrap; }
  select.filter-select {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 14px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    cursor: pointer;
  }
  select:focus { outline: none; border-color: var(--accent); }

  /* ── Ideas list ── */
  .ideas-list { display: flex; flex-direction: column; gap: 14px; }

  .idea-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 26px;
    display: flex;
    gap: 20px;
    align-items: flex-start;
    transition: border-color 0.15s;
  }
  .idea-card:hover { border-color: rgba(79,255,176,0.25); }

  .idea-priority-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 6px;
  }
  .priority-high   { background: var(--warn); }
  .priority-medium { background: #e8c840; }
  .priority-low    { background: var(--accent); }

  .idea-content { flex: 1; }
  .idea-title { font-size: 1rem; font-weight: 700; margin-bottom: 6px; }
  .idea-desc { font-family: 'DM Mono', monospace; font-size: 0.76rem; color: var(--muted); line-height: 1.6; margin-bottom: 12px; }

  .idea-meta {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .meta-item {
    font-family: 'DM Mono', monospace;
    font-size: 0.66rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .meta-item span { color: var(--text); }

  .priority-badge {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    padding: 2px 8px;
    border-radius: 20px;
    letter-spacing: 0.05em;
    font-weight: 500;
  }
  .badge-high   { background: rgba(255,107,74,0.15); color: var(--warn); }
  .badge-medium { background: rgba(232,200,64,0.15); color: #e8c840; }
  .badge-low    { background: rgba(79,255,176,0.12); color: var(--accent); }

  .idea-actions { display: flex; gap: 6px; flex-shrink: 0; }

  /* ── Modal ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 20px;
    overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 36px;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
  }
  .modal h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: 24px; }
  .modal h2 span { color: var(--accent); }

  .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .form-group label { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .form-group input,
  .form-group select,
  .form-group textarea {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.82rem;
    transition: border-color 0.15s;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { outline: none; border-color: var(--accent); }
  .form-group textarea { resize: vertical; min-height: 100px; }
  .form-group select option { background: var(--surface); }

  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

  /* ── Empty / loading ── */
  .state-msg {
    text-align: center;
    padding: 60px 20px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    font-size: 0.85rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .state-msg .big { font-size: 2.5rem; margin-bottom: 12px; }

  /* ── Toast ── */
  #toast {
    position: fixed; bottom: 28px; right: 28px;
    background: var(--accent); color: #000;
    font-family: 'DM Mono', monospace; font-size: 0.8rem;
    padding: 12px 20px; border-radius: 8px;
    transform: translateY(80px); opacity: 0;
    transition: all 0.3s; z-index: 999;
  }
  #toast.show { transform: translateY(0); opacity: 1; }

  .page-title {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }
  .page-title h1 { font-size: 1.8rem; font-weight: 800; }
  .page-title .icon { font-size: 1.8rem; }

  @media (max-width: 640px) {
    main { padding: 20px; }
    header { padding: 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <a class="back-link" href="/portal.html">← Portal</a>
    <div class="logo">RMT<span>/</span>Networks</div>
  </div>
  <button class="btn btn-primary" onclick="openModal()">+ Add Idea</button>
</header>

<main>
  <div class="page-title">
    <span class="icon">💡</span>
    <h1>Ideas</h1>
  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <select class="filter-select" id="filter-priority" onchange="renderIdeas()">
        <option value="">All Priorities</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select>
      <select class="filter-select" id="filter-who" onchange="renderIdeas()">
        <option value="">All People</option>
        <option value="Rob">Rob</option>
        <option value="Katy">Katy</option>
      </select>
    </div>
    <span id="idea-count" style="font-family:'DM Mono',monospace;font-size:0.72rem;color:var(--muted)"></span>
  </div>

  <div id="ideas-list">
    <div class="state-msg"><div class="big">⟳</div>Loading...</div>
  </div>
</main>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">Add <span>Idea</span></h2>

    <div class="form-group">
      <label>Title *</label>
      <input type="text" id="f-title" placeholder="What's the idea?">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="f-desc" placeholder="More detail, context, or next steps..."></textarea>
    </div>
    <div class="form-group">
      <label>Priority</label>
      <select id="f-priority">
        <option value="High">High</option>
        <option value="Medium" selected>Medium</option>
        <option value="Low">Low</option>
      </select>
    </div>
    <div class="form-group">
      <label>Added by</label>
      <select id="f-who">
        <option value="Rob">Rob</option>
        <option value="Katy">Katy</option>
      </select>
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveIdea()">Save Idea</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  let SUPABASE_URL = '';
  let SUPABASE_KEY = '';
  let allIdeas = [];
  let editingId = null;

  async function initConfig() {
    const res = await fetch('/.netlify/functions/config');
    const cfg = await res.json();
    SUPABASE_URL = cfg.supabaseUrl;
    SUPABASE_KEY = cfg.supabaseKey;
  }

  function sbHeaders() {
    return {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
    };
  }

  async function loadIdeas() {
    await initConfig();
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/ideas?order=created_at.desc`, { headers: sbHeaders() });
      if (!res.ok) throw new Error(await res.text());
      allIdeas = await res.json();
      renderIdeas();
    } catch (e) {
      document.getElementById('ideas-list').innerHTML =
        `<div class="state-msg"><div class="big">⚠</div>Could not load ideas.<br>${e.message}</div>`;
    }
  }

  function renderIdeas() {
    const pri = document.getElementById('filter-priority').value;
    const who = document.getElementById('filter-who').value;

    const filtered = allIdeas.filter(r => {
      return (!pri || r.priority === pri) && (!who || r.added_by === who);
    });

    document.getElementById('idea-count').textContent = `${filtered.length} idea${filtered.length !== 1 ? 's' : ''}`;

    if (filtered.length === 0) {
      document.getElementById('ideas-list').innerHTML =
        `<div class="state-msg"><div class="big">💡</div>No ideas yet — add the first one!</div>`;
      return;
    }

    document.getElementById('ideas-list').innerHTML = `<div class="ideas-list">${filtered.map(r => {
      const dotClass = r.priority === 'High' ? 'priority-high' : r.priority === 'Low' ? 'priority-low' : 'priority-medium';
      const badgeClass = r.priority === 'High' ? 'badge-high' : r.priority === 'Low' ? 'badge-low' : 'badge-medium';
      const date = r.created_at ? new Date(r.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
      return `
        <div class="idea-card">
          <div class="idea-priority-dot ${dotClass}"></div>
          <div class="idea-content">
            <div class="idea-title">${r.title}</div>
            ${r.description ? `<div class="idea-desc">${r.description}</div>` : ''}
            <div class="idea-meta">
              <div class="meta-item">Priority <span><span class="priority-badge ${badgeClass}">${r.priority}</span></span></div>
              <div class="meta-item">Added by <span>${r.added_by}</span></div>
              <div class="meta-item">Date <span>${date}</span></div>
            </div>
          </div>
          <div class="idea-actions">
            <button class="btn btn-ghost" style="padding:5px 12px;font-size:0.72rem" onclick="editIdea('${r.id}')">Edit</button>
            <button class="btn btn-danger" onclick="deleteIdea('${r.id}')">✕</button>
          </div>
        </div>`;
    }).join('')}</div>`;
  }

  function openModal(id = null) {
    editingId = id;
    document.getElementById('modal-title').innerHTML = id ? 'Edit <span>Idea</span>' : 'Add <span>Idea</span>';
    if (id) {
      const r = allIdeas.find(x => x.id === id);
      document.getElementById('f-title').value    = r.title || '';
      document.getElementById('f-desc').value     = r.description || '';
      document.getElementById('f-priority').value = r.priority || 'Medium';
      document.getElementById('f-who').value      = r.added_by || 'Rob';
    } else {
      document.getElementById('f-title').value    = '';
      document.getElementById('f-desc').value     = '';
      document.getElementById('f-priority').value = 'Medium';
      document.getElementById('f-who').value      = 'Rob';
    }
    document.getElementById('modal').classList.add('open');
  }

  function closeModal() { document.getElementById('modal').classList.remove('open'); editingId = null; }
  function editIdea(id) { openModal(id); }

  async function saveIdea() {
    const title = document.getElementById('f-title').value.trim();
    if (!title) { toast('Title is required', true); return; }

    const payload = {
      title,
      description: document.getElementById('f-desc').value.trim() || null,
      priority:    document.getElementById('f-priority').value,
      added_by:    document.getElementById('f-who').value,
    };

    try {
      let res;
      if (editingId) {
        res = await fetch(`${SUPABASE_URL}/rest/v1/ideas?id=eq.${editingId}`, { method: 'PATCH', headers: sbHeaders(), body: JSON.stringify(payload) });
      } else {
        res = await fetch(`${SUPABASE_URL}/rest/v1/ideas`, { method: 'POST', headers: sbHeaders(), body: JSON.stringify(payload) });
      }
      if (!res.ok) throw new Error(await res.text());
      closeModal();
      await loadIdeas();
      toast(editingId ? 'Idea updated!' : 'Idea added!');
    } catch (e) {
      toast('Error saving: ' + e.message, true);
    }
  }

  async function deleteIdea(id) {
    const r = allIdeas.find(x => x.id === id);
    if (!confirm(`Delete "${r.title}"?`)) return;
    const res = await fetch(`${SUPABASE_URL}/rest/v1/ideas?id=eq.${id}`, { method: 'DELETE', headers: sbHeaders() });
    if (res.ok) { await loadIdeas(); toast('Deleted.'); }
    else toast('Delete failed', true);
  }

  function toast(msg, err = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = err ? 'var(--warn)' : 'var(--accent)';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

  loadIdeas();
</script>
</body>
</html>
