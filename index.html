<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RMT Networks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #0d0f14;
    --surface: #13161e;
    --border:  #1e2230;
    --accent:  #4fffb0;
    --accent2: #4b8fff;
    --warn:    #ff6b4a;
    --text:    #e8eaf0;
    --muted:   #5a6070;
    --card-bg: #181b24;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 44px 44px;
    opacity: 0.35;
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    top: -15%;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    height: 500px;
    background: radial-gradient(ellipse, rgba(79,255,176,0.07) 0%, transparent 68%);
    pointer-events: none;
  }

  .login-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 52px 48px;
    width: 100%;
    max-width: 420px;
    position: relative;
    z-index: 1;
    box-shadow: 0 24px 64px rgba(0,0,0,0.4);
  }

  .logo-mark {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--accent);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-mark::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
  }

  h1 {
    font-size: 2rem;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 6px;
    letter-spacing: -0.02em;
  }

  .subtitle {
    font-family: 'DM Mono', monospace;
    font-size: 0.74rem;
    color: var(--muted);
    margin-bottom: 44px;
    line-height: 1.5;
  }

  .field-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.67rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 8px;
    display: block;
  }

  .input-wrap {
    position: relative;
    margin-bottom: 10px;
  }

  .input-wrap input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 48px 14px 16px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    letter-spacing: 0.12em;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .input-wrap input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79,255,176,0.1);
  }

  .input-wrap input.error {
    border-color: var(--warn);
    box-shadow: 0 0 0 3px rgba(255,107,74,0.1);
  }

  .toggle-pw {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1rem;
    padding: 4px;
    transition: color 0.15s;
    line-height: 1;
  }
  .toggle-pw:hover { color: var(--text); }

  .error-msg {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--warn);
    margin-bottom: 16px;
    min-height: 20px;
    margin-top: 6px;
    display: none;
  }
  .error-msg.show { display: block; }

  .btn-login {
    width: 100%;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 15px;
    font-family: 'Syne', sans-serif;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: background 0.15s, transform 0.15s;
    margin-top: 8px;
  }
  .btn-login:hover:not(:disabled) { background: #6fffbe; transform: translateY(-1px); }
  .btn-login:active:not(:disabled) { transform: translateY(0); }
  .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

  .footer-note {
    text-align: center;
    margin-top: 36px;
    font-family: 'DM Mono', monospace;
    font-size: 0.63rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%      { transform: translateX(-7px); }
    40%      { transform: translateX(7px); }
    60%      { transform: translateX(-4px); }
    80%      { transform: translateX(4px); }
  }
  .shake { animation: shake 0.38s ease-in-out; }

  @media (max-width: 480px) {
    .login-card { padding: 36px 28px; margin: 16px; }
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo-mark">RMT Networks</div>
  <h1>Private Portal</h1>
  <p class="subtitle">Enter your access password to continue.</p>

  <label class="field-label" for="password">Access Password</label>
  <div class="input-wrap">
    <input type="password" id="password" placeholder="••••••••••••" autofocus autocomplete="current-password">
    <button class="toggle-pw" type="button" onclick="togglePw()" title="Show/hide">👁</button>
  </div>
  <div class="error-msg" id="error-msg">Incorrect password — try again.</div>

  <button class="btn-login" id="login-btn" onclick="doLogin()">Access Portal →</button>

  <div class="footer-note">rmtnetworks.com · private access only</div>
</div>

<script>
  // Already logged in? Skip straight to portal.
  if (sessionStorage.getItem('rmt_session')) {
    window.location.replace('/portal.html');
  }

  function togglePw() {
    const inp = document.getElementById('password');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }

  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  async function doLogin() {
    const pw  = document.getElementById('password').value;
    const btn = document.getElementById('login-btn');
    const err = document.getElementById('error-msg');
    const inp = document.getElementById('password');

    if (!pw) {
      inp.classList.add('error', 'shake');
      setTimeout(() => inp.classList.remove('shake'), 400);
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Checking...';
    err.classList.remove('show');
    inp.classList.remove('error');

    try {
      const res = await fetch('/.netlify/functions/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw })
      });

      if (res.ok) {
        const { token } = await res.json();
        sessionStorage.setItem('rmt_session', token);
        window.location.replace('/portal.html');
      } else {
        inp.classList.add('error', 'shake');
        setTimeout(() => inp.classList.remove('shake'), 400);
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Access Portal →';
        inp.focus();
      }
    } catch {
      err.textContent = 'Connection error — please try again.';
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Access Portal →';
    }
  }
</script>
</body>
</html>
