<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RMT Networks — Dashboard</title>
<script src="/js/vendor/supabase-2.118.0.js"></script>
<script src="/js/rmt-auth.js"></script>
<script>RMTAuth.guard({ allow: ['Rob', 'Katy'], otherwise: '/clients.html' });</script>
<script src="/js/portal-nav.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #0d0f14;
    --surface: #13161e;
    --border:  #1e2230;
    --accent:  #4fffb0;
    --accent2: #4b8fff;
    --warn:    #ff6b4a;
    --yellow:  #ffd166;
    --text:    #e8eaf0;
    --soft:    #a3a9b8;
    --muted:   #5a6070;
    --card-bg: #181b24;
    --stage-red:    #ff5470;
    --stage-green:  #4fffb0;
    --stage-yellow: #ffd166;
    --stage-pink:   #ff7cf0;
    --stage-blue:   #4b8fff;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    visibility: hidden;
  }
  a { color: inherit; }
  .mono { font-family: 'DM Mono', monospace; }

  main { max-width: 1400px; margin: 0 auto; padding: 28px 24px 64px; }

  /* Greeting ------------------------------------------------------------ */
  .greet { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .greet .eyebrow { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; }
  .greet h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; }
  .greet .meta { display: flex; align-items: center; gap: 12px; font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--muted); }
  .btn-refresh { background: none; border: 1px solid var(--border); color: var(--soft); border-radius: 6px; padding: 6px 12px; font-family: 'DM Mono', monospace; font-size: 0.7rem; cursor: pointer; }
  .btn-refresh:hover { color: var(--text); border-color: var(--muted); }

  /* KPI strip ----------------------------------------------------------- */
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
  .kpi {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; text-decoration: none; display: block; transition: border-color .15s;
  }
  a.kpi:hover { border-color: var(--muted); }
  .kpi .k-label { font-family: 'DM Mono', monospace; font-size: 0.64rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
  .kpi .k-val { font-size: 1.75rem; font-weight: 800; margin: 6px 0 2px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .kpi .k-sub { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--soft); min-height: 1em; }
  .kpi.warn { border-color: rgba(255,107,74,0.45); }
  .kpi.warn .k-val { color: var(--warn); }
  .kpi.good .k-val { color: var(--accent); }

  /* Panels ---------------------------------------------------------------- */
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
  .panel {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px 20px; min-width: 0; display: flex; flex-direction: column;
  }
  .span-7 { grid-column: span 7; } .span-5 { grid-column: span 5; }
  .span-6 { grid-column: span 6; } .span-4 { grid-column: span 4; } .span-3 { grid-column: span 3; }
  .p-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .p-title { font-size: 0.98rem; font-weight: 700; display: flex; align-items: baseline; gap: 8px; }
  .p-count { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--muted); font-weight: 400; }
  .p-link { font-family: 'DM Mono', monospace; font-size: 0.66rem; color: var(--accent2); text-decoration: none; white-space: nowrap; }
  .p-link:hover { color: #7ab8ff; }
  .p-body { display: flex; flex-direction: column; gap: 2px; }
  /* Long lists scroll inside their panel instead of stretching the row. */
  #next .p-body, #waiting .p-body { max-height: 430px; overflow-y: auto; padding-right: 4px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .p-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--soft); display: flex; flex-wrap: wrap; gap: 6px 16px; }
  .p-foot b { color: var(--text); font-weight: 500; }
  .empty { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--muted); padding: 10px 0; }
  .err { color: var(--warn); }
  .skeleton { height: 14px; border-radius: 4px; background: var(--surface); margin: 8px 0; animation: pulse 1.4s ease-in-out infinite; }
  .skeleton:nth-child(2) { width: 82%; } .skeleton:nth-child(3) { width: 64%; }
  @keyframes pulse { 50% { opacity: .45; } }

  /* Rows ------------------------------------------------------------------- */
  .row {
    display: grid; gap: 4px 14px; align-items: center;
    padding: 10px 10px; margin: 0 -10px; border-radius: 9px; text-decoration: none;
  }
  a.row:hover { background: var(--surface); }
  .row + .row { border-top: 1px solid rgba(30,34,48,0.7); }
  .name { font-weight: 700; font-size: 0.88rem; }
  .company { font-family: 'DM Mono', monospace; font-size: 0.64rem; color: var(--muted); }
  .line { font-size: 0.8rem; color: var(--soft); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .age { font-family: 'DM Mono', monospace; font-size: 0.66rem; color: var(--muted); white-space: nowrap; text-align: right; }
  .age.stale { color: var(--warn); }
  .money { font-family: 'DM Mono', monospace; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }

  .r-active { grid-template-columns: minmax(120px, 1.1fr) auto minmax(0, 2.4fr) auto; }
  .r-owed   { grid-template-columns: minmax(0, 1fr) auto; }
  .r-owed .money { color: var(--warn); font-size: 0.95rem; }
  .r-next   { grid-template-columns: 112px minmax(0, 1fr) auto; align-items: start; }
  .r-limit  { grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; }

  .pill {
    display: inline-block; font-family: 'DM Mono', monospace; font-size: 0.62rem; letter-spacing: 0.04em;
    padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap;
  }
  .pill-red    { color: var(--stage-red);    border-color: var(--stage-red);    background: rgba(255,84,112,0.1); }
  .pill-green  { color: var(--stage-green);  border-color: var(--stage-green);  background: rgba(79,255,176,0.1); }
  .pill-yellow { color: var(--stage-yellow); border-color: var(--stage-yellow); background: rgba(255,209,102,0.1); }
  .pill-pink   { color: var(--stage-pink);   border-color: var(--stage-pink);   background: rgba(255,124,240,0.1); }
  .pill-blue   { color: var(--stage-blue);   border-color: var(--stage-blue);   background: rgba(75,143,255,0.1); }

  .tag { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .tag.overdue { color: var(--warn); }

  /* Waiting: grouped by client */
  .w-client { padding: 10px 0; }
  .w-client + .w-client { border-top: 1px solid rgba(30,34,48,0.7); }
  .w-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 4px; text-decoration: none; }
  .w-head:hover .name { text-decoration: underline; }
  .w-item { display: grid; grid-template-columns: 148px minmax(0, 1fr); gap: 10px; padding: 3px 0; }
  .w-item .tag { padding-top: 3px; }

  /* Pipeline */
  .stages { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-bottom: 12px; }
  .stage { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 9px 10px; }
  .stage .s-n { font-size: 1.2rem; font-weight: 800; }
  .stage .s-l { font-family: 'DM Mono', monospace; font-size: 0.58rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .stage .s-v { font-family: 'DM Mono', monospace; font-size: 0.62rem; color: var(--soft); }
  .stage.zero { opacity: 0.5; }
  .sub-h { font-family: 'DM Mono', monospace; font-size: 0.62rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin: 10px 0 2px; }

  /* Limits */
  .bar { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: var(--surface); overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
  .bar.mid > span { background: var(--yellow); }
  .bar.over > span { background: var(--warn); }
  .lim-name { font-size: 0.8rem; }
  .lim-name .svc { font-weight: 700; }
  .lim-val { font-family: 'DM Mono', monospace; font-size: 0.66rem; color: var(--soft); white-space: nowrap; }
  .lim-val.over { color: var(--warn); } .lim-val.mid { color: var(--yellow); }

  /* Backups */
  .backup-row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 8px 10px; margin: 0 -10px; border-radius: 8px; text-decoration: none; font-family: 'DM Mono', monospace; font-size: 0.74rem; }
  a.backup-row:hover { background: var(--surface); }
  .backup-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .backup-dot.green { background: var(--accent); box-shadow: 0 0 8px rgba(79,255,176,0.55); }
  .backup-dot.red   { background: var(--warn);   box-shadow: 0 0 8px rgba(255,107,74,0.6); }
  .backup-reason { grid-column: 2 / -1; color: var(--warn); font-size: 0.66rem; }

  @media (max-width: 1150px) {
    .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .span-7, .span-5, .span-6, .span-4, .span-3 { grid-column: span 6; }
    .span-7 { grid-column: span 12; }
  }
  @media (max-width: 760px) {
    main { padding: 20px 16px 48px; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid > .panel { grid-column: span 12; }
    .r-active { grid-template-columns: minmax(0, 1fr) auto; }
    .r-active .line { grid-column: 1 / -1; }
    .r-next { grid-template-columns: minmax(0, 1fr) auto; }
    .r-next .company-col { grid-column: 1 / -1; }
    .w-item { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .stages { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .greet h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<main>
  <div class="greet">
    <div>
      <div class="eyebrow" id="today">&nbsp;</div>
      <h1 id="hello">Dashboard</h1>
    </div>
    <div class="meta">
      <span id="updated">Loading…</span>
      <button class="btn-refresh" type="button" id="refresh">↻ Refresh</button>
    </div>
  </div>

  <div class="kpis" id="kpis">
    <a class="kpi" href="/command-center.html" id="kpi-active"><div class="k-label">Active clients</div><div class="k-val">—</div><div class="k-sub"></div></a>
    <a class="kpi" href="/clients.html" id="kpi-owed"><div class="k-label">Owed to you</div><div class="k-val">—</div><div class="k-sub"></div></a>
    <a class="kpi" href="#waiting" id="kpi-waiting"><div class="k-label">Waiting on clients</div><div class="k-val">—</div><div class="k-sub"></div></a>
    <a class="kpi" href="#pipeline" id="kpi-pipeline"><div class="k-label">Pipeline</div><div class="k-val">—</div><div class="k-sub"></div></a>
    <a class="kpi" href="#backups" id="kpi-backups"><div class="k-label">Backups</div><div class="k-val">—</div><div class="k-sub"></div></a>
  </div>

  <div class="grid">
    <section class="panel span-7" id="active">
      <div class="p-head"><div class="p-title">Active clients <span class="p-count"></span></div><a class="p-link" href="/command-center.html">Command Center →</a></div>
      <div class="p-body"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    </section>

    <section class="panel span-5" id="owed">
      <div class="p-head"><div class="p-title">Money owed <span class="p-count"></span></div><a class="p-link" href="/clients.html">Clients →</a></div>
      <div class="p-body"><div class="skeleton"></div><div class="skeleton"></div></div>
      <div class="p-foot" id="owed-foot"></div>
    </section>

    <section class="panel span-6" id="next">
      <div class="p-head"><div class="p-title">Next steps <span class="p-count"></span></div><a class="p-link" href="/command-center.html">Command Center →</a></div>
      <div class="p-body"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    </section>

    <section class="panel span-6" id="waiting">
      <div class="p-head"><div class="p-title">Waiting on clients <span class="p-count"></span></div><a class="p-link" href="/command-center.html">Command Center →</a></div>
      <div class="p-body"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    </section>

    <section class="panel span-5" id="pipeline">
      <div class="p-head"><div class="p-title">Pipeline <span class="p-count"></span></div><a class="p-link" href="/clients.html">Clients →</a></div>
      <div class="p-body"><div class="skeleton"></div><div class="skeleton"></div></div>
    </section>

    <section class="panel span-4" id="ops">
      <div class="p-head"><div class="p-title">Ops health <span class="p-count"></span></div><a class="p-link" href="/tracker.html">Usage →</a></div>
      <div class="p-body"><div class="skeleton"></div><div class="skeleton"></div></div>
    </section>

    <section class="panel span-3" id="backups">
      <div class="p-head"><div class="p-title">Backups <span class="p-count"></span></div><span class="p-link" style="color:var(--muted)">Nightly · B2</span></div>
      <div class="p-body"><div class="skeleton"></div></div>
    </section>
  </div>
</main>

<script>
(function () {
  'use strict';

  // ── helpers ───────────────────────────────────────────────────────────
  const $ = (sel, root) => (root || document).querySelector(sel);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const usd = (n) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: n % 1 ? 2 : 0 }).format(n || 0);
  const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));
  const daysLabel = (d) => d == null ? 'never updated' : d === 0 ? 'today' : d === 1 ? '1 day ago' : d + ' days ago';
  const shortDate = (ymd) => ymd ? new Date(ymd + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
  const clientHref = (id) => '/clients.html?client=' + encodeURIComponent(id);

  const STAGE = {
    pending_client:   ['Pending Client', 'red'],
    building:         ['Building', 'green'],
    on_hold:          ['On-Hold', 'red'],
    completed:        ['Completed', 'green'],
    pending_payment:  ['Pending Payment', 'yellow'],
    pending_delivery: ['Pending Delivery', 'blue'],
    new_build:        ['New Build', 'pink'],
  };
  const PIPE = { new_lead: 'New lead', contacted: 'Contacted', proposal_sent: 'Proposal sent', won: 'Won', lost: 'Lost' };

  function pill(ps) {
    const s = STAGE[ps];
    return s ? `<span class="pill pill-${s[1]}">${s[0]}</span>` : `<span class="pill">No stage</span>`;
  }
  function setBody(id, html) { $('#' + id + ' .p-body').innerHTML = html; }
  function setCount(id, text) { $('#' + id + ' .p-count').textContent = text || ''; }
  function kpi(id, val, sub, state) {
    const el = $('#kpi-' + id);
    $('.k-val', el).textContent = val;
    $('.k-sub', el).textContent = sub || '';
    el.classList.toggle('warn', state === 'warn');
    el.classList.toggle('good', state === 'good');
  }
  const empty = (msg) => `<div class="empty">${esc(msg)}</div>`;

  // ── panels ───────────────────────────────────────────────────────────
  function renderActive(rows) {
    const stale = rows.filter((r) => r.stale).length;
    kpi('active', rows.length, stale ? `${stale} not updated in 7+ days` : 'all updated this week', stale ? 'warn' : null);
    setCount('active', rows.length || '');
    setBody('active', rows.length ? rows.map((r) => `
      <a class="row r-active" href="${clientHref(r.id)}">
        <div><div class="name">${esc(r.name)}</div>${r.company ? `<div class="company">${esc(r.company)}</div>` : ''}</div>
        <div>${pill(r.project_status)}</div>
        <div class="line">${r.current_status ? esc(r.current_status) : '<span style="color:var(--muted)">No status logged</span>'}</div>
        <div class="age${r.stale ? ' stale' : ''}">${daysLabel(r.updated_days)}</div>
      </a>`).join('') : empty('No active clients.'));
  }

  function renderOwed(o) {
    kpi('owed', usd(o.total), o.clients.length ? `across ${plural(o.clients.length, 'client')}` : 'nothing outstanding', o.total > 0 ? 'warn' : 'good');
    setCount('owed', o.clients.length ? usd(o.total) : '');
    setBody('owed', o.clients.length ? o.clients.map((c) => `
      <a class="row r-owed" href="${clientHref(c.id)}">
        <div>
          <div class="name">${esc(c.name)}</div>
          <div class="company">billed ${usd(c.charged)}${c.last_paid ? ' · last paid ' + shortDate(c.last_paid) : ' · no payments yet'}</div>
        </div>
        <div class="money">${usd(c.balance)}</div>
      </a>`).join('') : empty('Every client is paid up.'));
    $('#owed-foot').innerHTML =
      `<span>Received this month <b>${usd(o.received_this_month)}</b></span><span>All-time <b>${usd(o.received_total)}</b></span>` +
      `<span id="stripe-line"></span>`;
  }

  function renderNext(items) {
    setCount('next', items.length || '');
    setBody('next', items.length ? items.map((n) => {
      const tag = n.kind === 'next' ? `<span class="tag">${esc(daysLabel(n.updated_days))}</span>`
        : `<span class="tag${n.overdue ? ' overdue' : ''}">${n.kind}${n.due ? ' · ' + (n.overdue ? 'overdue ' : 'due ') + shortDate(n.due) : ''}</span>`;
      return `
      <a class="row r-next" href="${clientHref(n.id)}">
        <div class="company-col"><div class="name" style="font-size:.8rem">${esc(n.name)}</div></div>
        <div class="line" style="color:var(--text)">${esc(n.text)}</div>
        <div class="age">${tag}</div>
      </a>`;
    }).join('') : empty('Nothing queued. Log a next step with crm-log or in the Command Center.'));
  }

  function renderWaiting(items) {
    const byClient = new Map();
    for (const w of items) {
      if (!byClient.has(w.id)) byClient.set(w.id, { name: w.name, days: w.days, items: [] });
      byClient.get(w.id).items.push(w);
    }
    const groups = [...byClient.entries()].sort((a, b) => (b[1].days ?? 0) - (a[1].days ?? 0));
    const oldest = groups.length ? groups[0][1].days : null;
    kpi('waiting', items.length, groups.length ? `${plural(groups.length, 'client')} · oldest ${daysLabel(oldest)}` : 'nobody is blocking you',
      oldest != null && oldest >= 7 ? 'warn' : null);
    setCount('waiting', items.length || '');
    setBody('waiting', groups.length ? groups.map(([id, g]) => `
      <div class="w-client">
        <a class="w-head" href="${clientHref(id)}"><span class="name">${esc(g.name)}</span><span class="age${g.days >= 7 ? ' stale' : ''}">${daysLabel(g.days)}</span></a>
        ${g.items.map((w) => `<div class="w-item"><span class="tag">${esc(w.kind)}</span><span class="line">${esc(w.text)}</span></div>`).join('')}
      </div>`).join('') : empty('Nothing waiting on clients.'));
  }

  function renderPipeline(p) {
    const overdue = p.followups.filter((f) => f.overdue).length;
    kpi('pipeline', p.open_count, (p.open_value ? usd(p.open_value) + ' open' : 'no deal values set') + (overdue ? ` · ${overdue} follow-up overdue` : ''), overdue ? 'warn' : null);
    setCount('pipeline', p.open_count ? plural(p.open_count, 'prospect') : '');
    const stages = `<div class="stages">${p.stages.map((s) => `
      <div class="stage${s.count ? '' : ' zero'}"><div class="s-n">${s.count}</div><div class="s-l">${PIPE[s.stage] || s.stage}</div><div class="s-v">${s.value ? usd(s.value) : '&nbsp;'}</div></div>`).join('')}</div>`;
    const prospects = p.prospects.length ? `<div class="sub-h">Prospects</div>` + p.prospects.map((c) => `
      <a class="row r-owed" href="${clientHref(c.id)}">
        <div><div class="name">${esc(c.name)}</div><div class="line" style="font-size:.74rem">${c.next_up ? esc(c.next_up) : '<span style="color:var(--muted)">No next step</span>'}</div></div>
        <div class="age">${esc(PIPE[c.stage] || c.stage)}${c.deal_value ? '<br>' + usd(c.deal_value) : ''}</div>
      </a>`).join('') : '';
    const follow = p.followups.length ? `<div class="sub-h">Follow-ups due</div>` + p.followups.map((f) => `
      <a class="row r-owed" href="${clientHref(f.id)}">
        <div class="name" style="font-size:.82rem">${esc(f.name)}</div>
        <div class="age${f.overdue ? ' stale' : ''}">${f.overdue ? 'overdue · ' : ''}${shortDate(f.date)}</div>
      </a>`).join('') : '';
    setBody('pipeline', stages + (prospects || follow ? prospects + follow : empty('No prospects yet.')));
  }

  function renderOps(limits) {
    const hot = limits.filter((l) => l.pct >= 80);
    setCount('ops', hot.length ? `${hot.length} near or over limit` : '');
    $('#ops .p-count').style.color = hot.length ? 'var(--warn)' : '';
    setBody('ops', limits.length ? limits.map((l) => {
      const cls = l.pct >= 100 ? 'over' : l.pct >= 80 ? 'mid' : '';
      const fmt = (v) => (Math.round(v * 100) / 100).toLocaleString();
      return `
      <div class="row r-limit">
        <div class="lim-name"><span class="svc">${esc(l.service)}</span> · ${esc(l.metric)}</div>
        <div class="lim-val ${cls}">${l.pct}% · ${fmt(l.used)} / ${fmt(l.limit)} ${esc(l.unit)}${l.updated_days > 2 ? ` · ${l.updated_days}d old` : ''}</div>
        <div class="bar ${cls}"><span style="width:${Math.min(100, Math.max(1, l.pct))}%"></span></div>
      </div>`;
    }).join('') : empty('No usage limits tracked.'));
  }

  // ── data ───────────────────────────────────────────────────────────────
  async function loadDashboard() {
    try {
      const r = await fetch('/.netlify/functions/dashboard');
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
      renderActive(d.active);
      renderOwed(d.owed);
      renderNext(d.next);
      renderWaiting(d.waiting);
      renderPipeline(d.pipeline);
      renderOps(d.limits);
      $('#updated').textContent = 'Updated ' + new Date(d.generated_at).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    } catch (e) {
      ['active', 'owed', 'next', 'waiting', 'pipeline', 'ops'].forEach((id) => setBody(id, `<div class="empty err">Could not load: ${esc(e.message)}</div>`));
      $('#updated').textContent = 'Load failed';
    }
  }

  async function loadBackups() {
    const ago = (iso) => {
      if (!iso) return 'never';
      const h = (Date.now() - new Date(iso).getTime()) / 3600000;
      return h < 1 ? 'just now' : h < 48 ? Math.round(h) + 'h ago' : Math.round(h / 24) + 'd ago';
    };
    try {
      const r = await fetch('/.netlify/functions/backup-status');
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
      const sites = d.sites || [];
      const bad = sites.filter((s) => s.state !== 'green').length;
      kpi('backups', sites.length ? `${sites.length - bad}/${sites.length}` : '—',
        !sites.length ? 'no sites reporting' : bad ? `${plural(bad, 'site')} failing` : 'all passing', bad ? 'warn' : sites.length ? 'good' : null);
      setCount('backups', sites.length ? (bad ? `${bad} failing` : 'all green') : '');
      $('#backups .p-count').style.color = bad ? 'var(--warn)' : 'var(--accent)';
      setBody('backups', sites.length ? sites.map((s) => {
        const tag = s.run_url ? 'a' : 'div';
        const href = s.run_url ? ` href="${esc(s.run_url)}" target="_blank" rel="noopener"` : '';
        return `<${tag} class="backup-row"${href} title="${esc(s.reason || '')}">
          <span class="backup-dot ${s.state === 'green' ? 'green' : 'red'}"></span>
          <span>${esc(s.label)}</span>
          <span style="color:var(--muted);font-size:.66rem">${esc(ago(s.ran_at))}</span>
          ${s.state === 'green' ? '' : `<span class="backup-reason">${esc(s.reason)}${s.last_pass_at ? ' · last good ' + esc(ago(s.last_pass_at)) : ''}</span>`}
        </${tag}>`;
      }).join('') : empty('No sites reporting yet.'));
    } catch (e) {
      kpi('backups', '?', 'status unavailable', 'warn');
      setBody('backups', `<div class="empty err">Could not load: ${esc(e.message)}</div>`);
    }
  }

  // Rob only: Stripe's own view of open invoices, next to the CRM ledger.
  async function loadStripe(user) {
    if (user !== 'Rob') return;
    try {
      const r = await fetch('/.netlify/functions/stripe-metrics');
      if (!r.ok) return;
      const m = await r.json();
      const fmt = (c) => usd((c || 0) / 100);
      const el = $('#stripe-line');
      if (el) el.innerHTML = `Stripe: outstanding <b>${fmt(m.total_outstanding_cents)}</b> · this month <b>${fmt(m.received_this_month_cents)}</b>`;
    } catch (_) { /* optional */ }
  }

  function loadAll(user) {
    $('#updated').textContent = 'Loading…';
    return Promise.all([loadDashboard().then(() => loadStripe(user)), loadBackups()]);
  }

  RMTAuth.guard().then((info) => {
    const h = new Date().getHours();
    const part = h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
    $('#hello').textContent = `Good ${part}${info.user ? ', ' + info.user : ''}`;
    $('#today').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    $('#refresh').addEventListener('click', () => loadAll(info.user));
    loadAll(info.user);
  });
})();
</script>
</body>
</html>
