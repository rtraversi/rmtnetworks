<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RMT Networks — VPS Monitor</title>
<script>
  (function() {
    var token = sessionStorage.getItem('rmt_session');
    if (!token) { window.location.replace('/'); return; }
    fetch('/.netlify/functions/verify', {
      headers: { 'Authorization': 'Bearer ' + token }
    }).then(function(r) {
      if (!r.ok) { sessionStorage.removeItem('rmt_session'); window.location.replace('/'); }
      else { document.body.style.visibility = 'visible'; }
    }).catch(function() {
      document.body.style.visibility = 'visible';
    });
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #0d0f14;
    --surface: #13161e;
    --border:  #1e2230;
    --accent:  #4fffb0;
    --accent2: #4b8fff;
    --warn:    #ff6b4a;
    --text:    #e8eaf0;
    --muted:   #5a6070;
    --card-bg: #181b24;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    visibility: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 44px 44px;
    opacity: 0.18;
    pointer-events: none;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 40px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0;
    background: var(--bg);
    z-index: 100;
  }

  .header-left { display: flex; align-items: center; gap: 20px; }

  .back-link {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    text-decoration: none;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    transition: color 0.15s, border-color 0.15s;
  }
  .back-link:hover { color: var(--accent); border-color: var(--accent); }

  .logo { font-size: 1.1rem; font-weight: 800; letter-spacing: 0.08em; color: var(--accent); }
  .logo span { color: var(--muted); font-weight: 400; }

  .header-right { display: flex; align-items: center; gap: 16px; }

  .refresh-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.74rem;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: color 0.15s, border-color 0.15s;
  }
  .refresh-btn:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
  .refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 56px 40px 80px;
    position: relative;
    z-index: 1;
  }

  .page-header { margin-bottom: 48px; }

  .eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: var(--accent);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .eyebrow::before {
    content: '';
    display: inline-block;
    width: 5px; height: 5px;
    background: var(--accent);
    border-radius: 50%;
  }

  .page-header h1 {
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 10px;
  }

  .page-header p {
    font-family: 'DM Mono', monospace;
    font-size: 0.76rem;
    color: var(--muted);
  }

  /* Server info card */
  .server-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 26px;
    margin-bottom: 24px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 18px 32px;
  }
  .server-card.loading { opacity: 0.45; }
  .info-field { display: flex; flex-direction: column; gap: 4px; }
  .info-field .lbl {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .info-field .val {
    font-family: 'DM Mono', monospace;
    font-size: 0.86rem;
    color: var(--text);
    word-break: break-all;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .info-field .copy-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 0.66rem;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .info-field .copy-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* Primary metrics — disk + bandwidth full width */
  .primary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }

  /* Secondary metrics — CPU + memory */
  .secondary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 40px;
  }

  .metric-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
  }

  .metric-card.loading { opacity: 0.45; }

  .metric-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .metric-label .label-icon { font-size: 1rem; opacity: 0.7; }

  .metric-value {
    font-family: 'DM Mono', monospace;
    font-size: 2.6rem;
    font-weight: 500;
    line-height: 1;
    letter-spacing: -0.03em;
    margin-bottom: 6px;
  }

  .metric-sub {
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 22px;
  }

  .bar-track {
    background: var(--border);
    border-radius: 4px;
    height: 5px;
    width: 100%;
    overflow: hidden;
  }

  .bar-fill {
    height: 5px;
    border-radius: 4px;
    transition: width 0.6s ease;
  }

  .bar-pct {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 8px;
    text-align: right;
  }

  /* Secondary (no sub-text, smaller value) */
  .metric-card.secondary .metric-value {
    font-size: 3.2rem;
    margin-bottom: 6px;
  }

  .metric-card.secondary .metric-value span {
    font-size: 1.4rem;
    opacity: 0.6;
  }

  .metric-card.secondary .metric-sub {
    margin-bottom: 16px;
  }

  /* Status bar at bottom */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
  }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .status-dot.ok    { background: var(--accent); }
  .status-dot.error { background: var(--warn); }

  .error-card {
    background: rgba(255,107,74,0.08);
    border: 1px solid rgba(255,107,74,0.3);
    border-radius: 12px;
    padding: 28px;
    font-family: 'DM Mono', monospace;
    font-size: 0.82rem;
    color: var(--warn);
    margin-bottom: 24px;
  }

  @media (max-width: 640px) {
    header { padding: 20px; }
    main { padding: 32px 20px 60px; }
    .primary-grid, .secondary-grid { grid-template-columns: 1fr; }
    .page-header h1 { font-size: 1.9rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <a class="back-link" href="/portal.html">← Portal</a>
    <div class="logo">RMT<span>/</span>Networks</div>
  </div>
  <div class="header-right">
    <button class="refresh-btn" id="refresh-btn" onclick="fetchMetrics()">↺ Refresh</button>
  </div>
</header>

<main>
  <div class="page-header">
    <div class="eyebrow">Hostinger VPS</div>
    <h1>Server Monitor</h1>
    <p id="last-updated">Fetching metrics...</p>
  </div>

  <div id="error-banner" class="error-card" style="display:none"></div>

  <div class="server-card loading" id="server-card">
    <div class="info-field">
      <span class="lbl">Hostname</span>
      <span class="val"><span id="srv-host">—</span><button class="copy-btn" onclick="copyVal('srv-host')">Copy</button></span>
    </div>
    <div class="info-field">
      <span class="lbl">IP Address</span>
      <span class="val"><span id="srv-ip">—</span><button class="copy-btn" onclick="copyVal('srv-ip')">Copy</button></span>
    </div>
    <div class="info-field">
      <span class="lbl">Plan</span>
      <span class="val" id="srv-plan">—</span>
    </div>
    <div class="info-field">
      <span class="lbl">OS</span>
      <span class="val" id="srv-os">—</span>
    </div>
  </div>

  <div class="primary-grid">
    <div class="metric-card loading" id="card-disk">
      <div class="metric-label">Disk Usage <span class="label-icon">💾</span></div>
      <div class="metric-value" id="disk-value" style="color:var(--accent)">—</div>
      <div class="metric-sub" id="disk-sub">— GB used of — GB</div>
      <div class="bar-track"><div class="bar-fill" id="disk-bar" style="width:0%;background:var(--accent)"></div></div>
      <div class="bar-pct" id="disk-pct">—%</div>
    </div>

    <div class="metric-card loading" id="card-bw">
      <div class="metric-label">Bandwidth (this month) <span class="label-icon">📡</span></div>
      <div class="metric-value" id="bw-value" style="color:var(--accent2)">—</div>
      <div class="metric-sub" id="bw-sub">— TB used of — TB</div>
      <div class="bar-track"><div class="bar-fill" id="bw-bar" style="width:0%;background:var(--accent2)"></div></div>
      <div class="bar-pct" id="bw-pct">—%</div>
    </div>
  </div>

  <div class="secondary-grid">
    <div class="metric-card secondary loading" id="card-cpu">
      <div class="metric-label">CPU Usage <span class="label-icon">⚡</span></div>
      <div class="metric-value" id="cpu-value" style="color:var(--accent)">—<span>%</span></div>
      <div class="metric-sub" id="cpu-sub">— cores</div>
      <div class="bar-track" style="margin-top:auto"><div class="bar-fill" id="cpu-bar" style="width:0%;background:var(--accent)"></div></div>
    </div>

    <div class="metric-card secondary loading" id="card-mem">
      <div class="metric-label">Memory Usage <span class="label-icon">🧠</span></div>
      <div class="metric-value" id="mem-value" style="color:var(--accent2)">—<span>%</span></div>
      <div class="metric-sub" id="mem-sub">— GB used of — GB</div>
      <div class="bar-track" style="margin-top:auto"><div class="bar-fill" id="mem-bar" style="width:0%;background:var(--accent2)"></div></div>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">Connecting...</span>
  </div>
</main>

<script>
  const REFRESH_MS = 4 * 60 * 60 * 1000; // 4 hours
  let refreshTimer = null;

  function pctColor(pct) {
    if (pct >= 85) return 'var(--warn)';
    if (pct >= 65) return '#e8c840';
    return null; // use default per-card color
  }

  function setStatus(ok, text) {
    const dot = document.getElementById('status-dot');
    dot.className = 'status-dot ' + (ok ? 'ok' : 'error');
    document.getElementById('status-text').textContent = text;
  }

  function fmtAgo(iso) {
    const mins = Math.round((Date.now() - new Date(iso)) / 60000);
    if (mins < 1)  return 'just now';
    if (mins < 60) return `${mins}m ago`;
    return `${Math.round(mins / 60)}h ago`;
  }

  function scheduleNext() {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(fetchMetrics, REFRESH_MS);
  }

  async function fetchMetrics() {
    const btn = document.getElementById('refresh-btn');
    btn.disabled = true;
    btn.textContent = '↺ Fetching...';
    document.getElementById('error-banner').style.display = 'none';

    try {
      const res = await fetch('/.netlify/functions/hostinger-vps');
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || `HTTP ${res.status}`);
      }

      renderMetrics(data);
      setStatus(true, `Last refreshed ${fmtAgo(data.fetched_at)} · auto-refresh in 4h`);
      document.getElementById('last-updated').textContent =
        `Updated ${new Date(data.fetched_at).toLocaleString()}`;
    } catch (e) {
      setStatus(false, 'Fetch failed — ' + e.message);
      document.getElementById('error-banner').style.display = 'block';
      document.getElementById('error-banner').textContent =
        'Could not load VPS metrics: ' + e.message +
        '\n\nCheck that HOSTINGER_API_KEY and HOSTINGER_VM_ID are set in Netlify environment variables.';
      document.getElementById('last-updated').textContent = 'Failed to load metrics';
    } finally {
      btn.disabled = false;
      btn.textContent = '↺ Refresh';
      scheduleNext();
    }
  }

  function renderMetrics(d) {
    // Server info card
    const s = d.server || {};
    document.getElementById('srv-host').textContent = s.hostname || '—';
    document.getElementById('srv-ip').textContent   = s.ip       || '—';
    document.getElementById('srv-plan').textContent = (s.plan ? String(s.plan).toUpperCase() : '—')
      + (s.cpu_cores ? ` · ${s.cpu_cores} cores` : '');
    document.getElementById('srv-os').textContent   = s.os || '—';
    document.getElementById('server-card').classList.remove('loading');

    // Disk
    const diskPct = d.disk.pct;
    const diskColor = pctColor(diskPct) || 'var(--accent)';
    document.getElementById('disk-value').style.color = diskColor;
    document.getElementById('disk-value').textContent = d.disk.used_gb.toFixed(1) + ' GB';
    document.getElementById('disk-sub').textContent = `${d.disk.used_gb.toFixed(1)} GB used of ${d.disk.total_gb} GB`;
    document.getElementById('disk-bar').style.width = Math.min(diskPct, 100).toFixed(1) + '%';
    document.getElementById('disk-bar').style.background = diskColor;
    document.getElementById('disk-pct').textContent = diskPct.toFixed(1) + '%';
    document.getElementById('card-disk').classList.remove('loading');

    // Bandwidth
    const bwPct = d.bandwidth.pct;
    const bwColor = pctColor(bwPct) || 'var(--accent2)';
    document.getElementById('bw-value').style.color = bwColor;
    document.getElementById('bw-value').textContent = d.bandwidth.used_tb.toFixed(3) + ' TB';
    document.getElementById('bw-sub').textContent =
      `${d.bandwidth.used_tb.toFixed(3)} TB used of ${d.bandwidth.total_tb} TB`;
    document.getElementById('bw-bar').style.width = Math.min(bwPct, 100).toFixed(2) + '%';
    document.getElementById('bw-bar').style.background = bwColor;
    document.getElementById('bw-pct').textContent = bwPct.toFixed(2) + '%';
    document.getElementById('card-bw').classList.remove('loading');

    // CPU
    const cpuPct = d.cpu.pct;
    const cpuColor = pctColor(cpuPct) || 'var(--accent)';
    document.getElementById('cpu-value').style.color = cpuColor;
    document.getElementById('cpu-value').innerHTML = cpuPct.toFixed(1) + '<span>%</span>';
    document.getElementById('cpu-sub').textContent =
      (d.cpu.cores ? `${d.cpu.cores} core${d.cpu.cores === 1 ? '' : 's'}` : '— cores');
    document.getElementById('cpu-bar').style.width = Math.min(cpuPct, 100).toFixed(1) + '%';
    document.getElementById('cpu-bar').style.background = cpuColor;
    document.getElementById('card-cpu').classList.remove('loading');

    // Memory
    const memPct = d.memory.pct;
    const memColor = pctColor(memPct) || 'var(--accent2)';
    document.getElementById('mem-value').style.color = memColor;
    document.getElementById('mem-value').innerHTML = memPct.toFixed(1) + '<span>%</span>';
    document.getElementById('mem-sub').textContent =
      `${d.memory.used_gb.toFixed(1)} GB used of ${d.memory.total_gb} GB`;
    document.getElementById('mem-bar').style.width = Math.min(memPct, 100).toFixed(1) + '%';
    document.getElementById('mem-bar').style.background = memColor;
    document.getElementById('card-mem').classList.remove('loading');
  }

  async function copyVal(id) {
    const text = document.getElementById(id).textContent.trim();
    if (!text || text === '—') return;
    try { await navigator.clipboard.writeText(text); }
    catch {}
  }

  fetchMetrics();
</script>

</body>
</html>
